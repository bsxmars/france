title: "Урок 6. Безличный оборот il est, имя прилагательное"
level: b1
book: book-pkk
summary: "Говоришь, который час (Il est six heures), согласуешь прилагательное с существительным в роде и числе и ставишь его на нужное место — до или после существительного."
topics:
  - "Безличный оборот il est для обозначения времени: Quelle heure est-il ? — Il est dix heures."
  - "Женский род прилагательных: seul — seule, gris — grise, heureux — heureuse, cadet — cadette"
  - "Множественное число прилагательных: немое -s, слова на -s и -x не меняются"
  - "Место прилагательного: обычно после существительного, частые короткие — перед ним"
sources:
  - {title: "Tex's French Grammar — Introduction to adjectives", url: "https://www.laits.utexas.edu/tex/gr/adj1.html"}
  - {title: "Tex's French Grammar — Adjectives: formation and placement", url: "https://www.laits.utexas.edu/tex/gr/adj2.html"}
  - {title: "Tex's French Grammar — Adjectives that precede the noun", url: "https://www.laits.utexas.edu/tex/gr/adj3.html"}
  - {title: "Tex's French Grammar — temps, heure, fois", url: "https://www.laits.utexas.edu/tex/gr/no5.html"}
  - {title: "Le Point du FLE — Les adjectifs", url: "https://www.lepointdufle.net/p/adjectifs.htm"}
  - {title: "Le Point du FLE — L'heure", url: "https://www.lepointdufle.net/p/lexique_heure.htm"}
