title: "Досье 2. Времена прошедшего, гипотезы о прошлом, passé simple, предлоги места"
level: b2
book: book-cosmo
summary: "Рассказываешь о прошлом точно: выбираешь между passé composé, imparfait и plus-que-parfait, связываешь события через après + infinitif passé, переигрываешь прошлое гипотезами si + plus-que-parfait, читаешь книжный рассказ в passé simple и описываешь место действия предлогами."
topics:
  - "Passé composé и imparfait: событие и фон; avoir или être"
  - "Plus-que-parfait и infinitif passé: что было раньше; depuis, il y a, pendant"
  - "Согласование причастия и три времени в одном рассказе"
  - "Гипотезы о прошлом: si + plus-que-parfait → conditionnel passé или présent"
  - "Passé simple: узнавать и понимать в письменном рассказе"
  - "Предлоги места: dans, sur, au bord de, en face de, au milieu de…"
sources:
  - {title: "Tex's French Grammar — Narration: passé composé vs. imparfait", url: "https://www.laits.utexas.edu/tex/gr/tap8.html"}
  - {title: "Tex's French Grammar — Plus-que-parfait", url: "https://www.laits.utexas.edu/tex/gr/tap9.html"}
  - {title: "Tex's French Grammar — Past conditional", url: "https://www.laits.utexas.edu/tex/gr/tac2.html"}
  - {title: "Tex's French Grammar — Passé simple", url: "https://www.laits.utexas.edu/tex/gr/tap10.html"}
  - {title: "Le Point du FLE — Passé composé / Imparfait", url: "https://www.lepointdufle.net/p/passecomposeimparfait.htm"}
  - {title: "Le Point du FLE — Prépositions de lieu", url: "https://www.lepointdufle.net/p/prepositions_de_lieu.htm"}
