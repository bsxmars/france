  - {title: "Tex's French Grammar — dire, lire, écrire", url: "https://www.laits.utexas.edu/tex/gr/virr11.html"}
  - {title: "Tex's French Grammar — partir, sortir, dormir", url: "https://www.laits.utexas.edu/tex/gr/vir3.html"}
  - {title: "Tex's French Grammar — Yes/no questions: est-ce que", url: "https://www.laits.utexas.edu/tex/gr/int2.html"}
  - {title: "Tex's French Grammar — Questions with inversion", url: "https://www.laits.utexas.edu/tex/gr/int3.html"}
  - {title: "Le Point du FLE — L'interrogation", url: "https://www.lepointdufle.net/p/interrogation.htm"}
