title: "Урок 7. Артикль после c'est, форма tu, вопрос"
level: b1
book: book-pkk
summary: "Выбираешь артикль после c'est, называешь национальность без артикля, спрягаешь глаголы в единственном числе (с формой tu) и задаёшь вопрос инверсией и через est-ce que."
topics:
  - "Артикль после c'est: C'est une chaise, но C'est la chaise de Marie"
  - "Национальность и жители города без артикля: Anna est russe, Marc est parisien"
  - "Форма tu глаголов I и III группы; aller, dire, écrire, faire, lire, mettre, partir, servir, pouvoir в единственном числе"
  - "Вопрос: простая и сложная инверсия, est-ce que"
sources:
  - {title: "Tex's French Grammar — Indefinite articles", url: "https://www.laits.utexas.edu/tex/gr/det4.html"}
