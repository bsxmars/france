title: "Итоговый тест B2 → C1"
level: c1
book: book-grammar
summary: "Проверяешь грамматику всей ступени на уровне DALF C1 — 60 вопросов, по четыре на каждый модуль c-01 … c-15 — и сравниваешь на «Прогрессе» результат с входным тестом по тем же темам."
topics:
  - "60 вопросов — по четыре на каждый модуль c-01 … c-15, новые предложения, ловушки уровня C1"
  - "Le mémoire / la mémoire, ciels, chefs-d'œuvre, délices; élu président, des grands-parents; le plus неизменяемое, sa propre voiture, quelles que soient, midi et demi"
  - "Нейтральное le, n'y être pour rien, en vouloir à; ce à quoi, près de laquelle, dont с числом; tout émue, aucuns frais, d'autres, quiconque"
  - "Ne explétif, ne… plus personne, ne… pas que; согласование причастия местоимённых глаголов (se sont écrit / plu / moquées); futur antérieur dans le passé, историческая перспектива"
  - "Passé antérieur и passé simple на узнавание; императив savoir, passé de l'impératif; quand bien même, conditionnel journalistique, 2-я форма conditionnel passé"
  - "Subjonctif после уступки и le seul, imparfait du subjonctif на узнавание; fait + infinitif, entendue jouer, proposition participe; c'est à… que, приказ в косвенной речи"
  - "Сравнение с входным тестом на странице «Прогресс»"
sources:
  - {title: "DALF — формат экзамена и уровень C1 (France Éducation international)", url: "https://www.france-education-international.fr/diplome/dalf"}
  - {title: "Tex's French Grammar — Subjunctive summary", url: "https://www.laits.utexas.edu/tex/gr/tas7.html"}
  - {title: "Le Point du FLE — Participe passé, accords", url: "https://www.lepointdufle.net/p/participespasses.htm"}
