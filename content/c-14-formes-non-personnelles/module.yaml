title: "Глава. Неличные формы глагола"
level: c1
book: book-grammar
summary: "Различаешь participe présent и adjectif verbal (в том числе на письме: fatiguant — fatigant, négligeant — négligent), строишь participe passé composé и gérondif, передаёшь русские деепричастия и причастия французскими формами, понимаешь и сам пишешь proposition participe (Le repas terminé, …), proposition infinitive после глаголов восприятия и каузативные конструкции faire / laisser + infinitif с правильным местом местоимений и согласованием причастия."
topics:
  - "Participe présent, participe passé composé и adjectif verbal: функции, согласование, орфографические пары"
  - "Gérondif: время, способ, условие, сопутствующее действие; tout en; sans + infinitif для отрицательного деепричастия"
  - "Participe passé без вспомогательного глагола: пассивное и активное значение, состояние и действие"
  - "Proposition participe (абсолютный причастный оборот) и proposition infinitive после voir, entendre, sentir"
  - "Каузативные конструкции faire / laisser + infinitif, se faire и se laisser + infinitif"
sources:
  - {title: "Tex's French Grammar — Present participle", url: "https://www.laits.utexas.edu/tex/gr/vpp1.html"}
  - {title: "Tex's French Grammar — Participles as adjectives", url: "https://www.laits.utexas.edu/tex/gr/adj9.html"}
  - {title: "Tex's French Grammar — Causative faire", url: "https://www.laits.utexas.edu/tex/gr/virr7.html"}
  - {title: "Tex's French Grammar — Infinitive constructions, including past", url: "https://www.laits.utexas.edu/tex/gr/vinf1.html"}
  - {title: "Le Point du FLE — Participe présent, gérondif, adjectif verbal", url: "https://www.lepointdufle.net/p/participepresent.htm"}
  - {title: "Le Point du FLE — Participe passé, accords", url: "https://www.lepointdufle.net/p/participespasses.htm"}
