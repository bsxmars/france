title: "Главы. Косвенная речь, косвенный вопрос, выделение"
level: c1
book: book-grammar
summary: "Пересказываешь чужие слова и вопросы с точным согласованием времён и указателей (la veille, le lendemain, ce jour-là), выбираешь точный вводящий глагол (prétendre, avouer, rétorquer), узнаёшь несобственно-прямую речь (discours indirect libre) в художественном тексте и выделяешь любой член предложения: c'est… qui / que, ce qui… c'est, вынесение с местоимением-повтором, voilà… qui, ne… que."
topics:
  - "Косвенная речь: согласование времён, лица, указатели времени и места, приказ → de + инфинитив, вводящие глаголы"
  - "Несобственно-прямая речь (discours indirect libre) — на узнавание"
  - "Косвенный вопрос: si, ce qui, ce que, qui, вопросительные слова; порядок слов и инверсия существительного"
  - "Выделение c'est… qui / c'est… que: согласование глагола, причастия, предлоги"
  - "Ce qui… c'est, ce que… c'est; вынесение (dislocation) с повтором местоимением; présentatifs voilà, il y a… qui"
sources:
  - {title: "Tex's French Grammar — Reported speech in the present", url: "https://www.laits.utexas.edu/tex/gr/tad1.html"}
  - {title: "Tex's French Grammar — Reported speech in the past", url: "https://www.laits.utexas.edu/tex/gr/tad2.html"}
  - {title: "Tex's French Grammar — c'est vs. il/elle est", url: "https://www.laits.utexas.edu/tex/gr/pro3.html"}
  - {title: "Tex's French Grammar — Disjunctive pronouns", url: "https://www.laits.utexas.edu/tex/gr/pro4.html"}
  - {title: "Le Point du FLE — Discours rapporté, discours indirect", url: "https://www.lepointdufle.net/p/discoursrapporte.htm"}
  - {title: "Le Point du FLE — L'interrogation", url: "https://www.lepointdufle.net/p/interrogation.htm"}
