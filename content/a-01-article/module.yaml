title: "Урок 1. Предложение и артикль"
level: b1
book: book-pkk
summary: "Строишь простую фразу «подлежащее + сказуемое», отличаешь знаменательные слова от служебных и понимаешь, зачем перед существительным стоит артикль и когда его нет."
topics:
  - "Строй французского предложения: подлежащее всегда перед сказуемым"
  - "Знаменательные и служебные слова"
  - "Артикль: род, число, определённость; артикль заменяется притяжательным словом, перед именами его нет"
sources:
  - {title: "Tex's French Grammar — Definite articles", url: "https://www.laits.utexas.edu/tex/gr/det2.html"}
  - {title: "Le Point du FLE — Les articles", url: "https://www.lepointdufle.net/p/articles.htm"}
