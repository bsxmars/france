title: "Урок 14. En и y, quand и comment, faire"
level: b1
book: book-pkk
summary: "Заменяешь «туда» и «оттуда» словами y и en и ставишь их на место, спрашиваешь «когда?» и «как?» с правильным порядком слов и спрягаешь faire."
topics:
  - "Наречия места en (оттуда) и y (туда, там): значение и место в предложении"
  - "Вопросительные наречия quand и comment; простая и сложная инверсия"
  - "Спряжение глагола faire"
sources:
  - {title: "Tex's French Grammar — Pronoun y", url: "https://www.laits.utexas.edu/tex/gr/pro6.html"}
  - {title: "Tex's French Grammar — Pronoun en", url: "https://www.laits.utexas.edu/tex/gr/pro7.html"}
  - {title: "Tex's French Grammar — Interrogative words: où, quand, comment", url: "https://www.laits.utexas.edu/tex/gr/int7.html"}
  - {title: "Tex's French Grammar — Questions with subject/verb inversion", url: "https://www.laits.utexas.edu/tex/gr/int3.html"}
  - {title: "Tex's French Grammar — faire", url: "https://www.laits.utexas.edu/tex/gr/virr5.html"}
  - {title: "Le Point du FLE — L'interrogation", url: "https://www.lepointdufle.net/p/interrogation.htm"}
