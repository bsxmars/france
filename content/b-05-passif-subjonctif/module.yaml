title: "Досье 5. Пассив, subjonctif для позиции и альтернативы, нюансы сравнения"
level: b2
book: book-cosmo
summary: "Выбираешь между пассивом, se faire + infinitif, местоименным пассивом и on, чтобы выдвинуть на первый план нужный элемент; занимаешь позицию в споре, не путая subjonctif и indicatif после je pense, je doute, il est évident, il est important; нюансируешь сравнения (de plus en plus, bien plus, deux fois moins, d'autant plus que, plus… plus…) и формулируешь альтернативу через que… ou que… с subjonctif."
topics:
  - "Voix passive во всех временах; par и de; se faire + infinitif; pronominal passif; on"
  - "Subjonctif для суждения, чувства, воли, сомнения; subjonctif или indicatif после глаголов мнения (утверждение и отрицание); subjonctif или infinitif"
  - "Nuancer une comparaison: de plus en plus / de moins en moins, bien / beaucoup plus, tout aussi / tout autant, deux fois plus, d'autant plus que, plus… plus…"
  - "Subjonctif для альтернативы: que… ou que…, que… ou non, soit que… soit que…"
sources:
