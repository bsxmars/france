title: "Урок 13. Неопределённый артикль, il y a, aller, venir"
level: b1
book: book-pkk
summary: "Выбираешь между un / une / des и le / la / les, говоришь, что где есть (il y a), не путаешь il y a с être, спрягаешь aller, venir и глаголы того же типа (revenir, devenir, tenir)."
topics:
  - "Неопределённый артикль: формы и значения"
  - "Безличный оборот il y a: утверждение, вопрос, отрицание il n'y a pas de; il y a или être"
  - "Спряжение глагола aller; aller + инфинитив"
  - "Глаголы типа venir: venir, revenir, devenir, prévenir, tenir, retenir"
sources:
  - {title: "Tex's French Grammar — Indefinite articles", url: "https://www.laits.utexas.edu/tex/gr/det4.html"}
  - {title: "Tex's French Grammar — voilà vs. il y a", url: "https://www.laits.utexas.edu/tex/gr/no4.html"}
  - {title: "Tex's French Grammar — aller", url: "https://www.laits.utexas.edu/tex/gr/virr4.html"}
  - {title: "Tex's French Grammar — venir", url: "https://www.laits.utexas.edu/tex/gr/virr8.html"}
  - {title: "Le Point du FLE — Les articles", url: "https://www.lepointdufle.net/p/articles.htm"}
