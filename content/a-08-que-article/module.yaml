title: "Урок 8. Que / qu'est-ce que, артикль при сказуемом, du / des"
level: b1
book: book-pkk
summary: "Спрашиваешь «что?» о прямом дополнении (que, qu'est-ce que), знаешь, когда профессии нужен артикль, и сливаешь de с артиклем: du, des."
topics:
  - "Вопрос к прямому дополнению: que + инверсия, qu'est-ce que + прямой порядок"
  - "Артикль при существительном-сказуемом: Elle est actrice, но Elle est une bonne actrice"
  - "Слитный артикль: de + le = du, de + les = des; de la, de l' не сливаются"
sources:
  - {title: "Tex's French Grammar — Interrogative pronouns", url: "https://www.laits.utexas.edu/tex/gr/int5.html"}
  - {title: "Tex's French Grammar — c'est vs. il/elle est", url: "https://www.laits.utexas.edu/tex/gr/pro3.html"}
  - {title: "Tex's French Grammar — Contractions of à and de with the definite article", url: "https://www.laits.utexas.edu/tex/gr/pre2.html"}
  - {title: "Le Point du FLE — L'interrogation", url: "https://www.lepointdufle.net/p/interrogation.htm"}
  - {title: "Le Point du FLE — Les articles", url: "https://www.lepointdufle.net/p/articles.htm"}
