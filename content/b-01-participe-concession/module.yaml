title: "Досье 1. Participe présent, futur antérieur, уступка, союзы времени"
level: b2
book: book-cosmo
summary: "Характеризуешь людей и вещи формами на -ant без орфографических ловушек (provoquant / provocant), показываешь предшествование через participe composé и futur antérieur, противопоставляешь и уступаешь (alors que, bien que, malgré, avoir beau) и выбираешь наклонение после союзов времени."
topics:
  - "Participe présent и adjectif verbal: действие или качество; gérondif"
  - "Participe composé (ayant fait, étant parti): предшествование и причина"
  - "Futur antérieur: что завершится раньше в будущем; предположение о прошлом"
  - "Opposition и concession: alors que, en revanche, bien que + subjonctif, malgré, même si, avoir beau"
  - "Союзы времени: avant que / jusqu'à ce que + subjonctif; pendant que, après que, dès que + indicatif"
sources:
  - {title: "Tex's French Grammar — Present participle", url: "https://www.laits.utexas.edu/tex/gr/vpp1.html"}
  - {title: "Tex's French Grammar — Futur antérieur", url: "https://www.laits.utexas.edu/tex/gr/taf5.html"}
  - {title: "Tex's French Grammar — Subordinating conjunctions", url: "https://www.laits.utexas.edu/tex/gr/con3.html"}
  - {title: "Tex's French Grammar — Conjunctions that take the subjunctive", url: "https://www.laits.utexas.edu/tex/gr/tas5.html"}
  - {title: "Le Point du FLE — Participe présent, gérondif, adjectif verbal", url: "https://www.lepointdufle.net/p/participepresent.htm"}
  - {title: "Le Point du FLE — Relations logiques", url: "https://www.lepointdufle.net/p/relationslogiques.htm"}
