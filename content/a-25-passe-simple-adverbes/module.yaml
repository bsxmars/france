title: "Урок 25. Passé simple, степени сравнения наречий"
level: b1
book: book-pkk
summary: "Узнаёшь и образуешь формы passé simple в книжном рассказе, отличаешь его от passé composé и imparfait, сравниваешь действия: plus vite, aussi bien, mieux, le plus, le moins."
topics:
  - "Passé simple: значение, образование (три типа окончаний на a, i, u), особые основы глаголов III группы, употребление в повествовании"
  - "Степени сравнения наречий: plus / moins / aussi … que, le plus / le moins; особые формы plus, moins, mieux"
sources:
  - {title: "Tex's French Grammar — Passé simple", url: "https://www.laits.utexas.edu/tex/gr/tap10.html"}
  - {title: "Tex's French Grammar — Comparative and superlative of adverbs", url: "https://www.laits.utexas.edu/tex/gr/adv4.html"}
  - {title: "Tex's French Grammar — bon/meilleur vs. bien/mieux", url: "https://www.laits.utexas.edu/tex/gr/adj8.html"}
  - {title: "Le Point du FLE — Passé simple", url: "https://www.lepointdufle.net/p/passesimple.htm"}
  - {title: "Le Point du FLE — Comparatifs et superlatifs", url: "https://www.lepointdufle.net/p/comparaison.htm"}
