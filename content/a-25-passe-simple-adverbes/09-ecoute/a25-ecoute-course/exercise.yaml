title: "Après la course"
type: listening
intro: "Двое друзей из Квебека говорят о забеге на 10 км. Послушай и ответь на вопросы."
hints:
  - "Числа можно писать цифрами или словами."
  - "moins vite que moi — медленнее меня."
audio: audio/tts/a-25/course.mp3
audio_source: {title: "Enregistrement du cours (edge-tts)", url: "https://github.com/rany2/edge-tts", author: "fr-CA-AntoineNeural, fr-CA-SylvieNeural", license: "TTS"}
transcript: |
  — Salut Julie ! Alors, ce dix kilomètres, dimanche ?
  — Très bien ! J'ai couru plus vite que l'année dernière : cinquante-deux minutes, au lieu de cinquante-huit.
  — Bravo ! Et ton frère ?
  — Lui, il a couru moins vite que moi, pour une fois ! Il s'entraîne beaucoup moins souvent depuis son nouveau travail.
  — Et qui a gagné ?
  — Chez les femmes, une dame de soixante ans ! C'est elle qui a couru le plus vite : quarante et une minutes.
  — Incroyable ! Moi, je cours beaucoup moins bien qu'elle, c'est sûr.
  — Tu veux venir avec nous l'année prochaine ? On s'entraîne le mardi et le jeudi, au parc.
  — Le mardi, je travaille tard. Mais le jeudi, oui, avec plaisir. Je vais courir le plus souvent possible !
  — Parfait. Mais attention : le jeudi, on court sur la colline. C'est le jour le plus difficile !
items:
  - q: "Cette année, Julie a couru les dix kilomètres en ___ minutes."
    answers: ["cinquante-deux", "52", "cinquante deux"]
    explain: "*cinquante-deux minutes, au lieu de cinquante-huit* — в прошлом году было 58."
  - q: "Почему брат Жюли бежал медленнее неё?"
    options: ["Он был болен.", "Он стал реже тренироваться из-за новой работы.", "Он бежал вместе с другом."]
    answer: 1
    explain: "*Il s'entraîne beaucoup **moins souvent** depuis son nouveau travail.*"
  - q: "Кто победил среди женщин?"
    options: ["Жюли", "женщина шестидесяти лет", "сестра Антуана"]
    answer: 1
    explain: "*une dame de soixante ans ! **C'est elle qui** a couru **le plus vite***."
  - q: "La gagnante a couru en ___ minutes."
    answers: ["quarante et une", "41", "quarante-et-une"]
    explain: "*quarante et une minutes* — *une* в женском роде, потому что *minute* женского рода."
  - q: "Когда Антуан будет тренироваться с Жюли?"
    options: ["по вторникам", "по четвергам", "по вторникам и четвергам"]
    answer: 1
    explain: "*Le mardi, je travaille tard. Mais le jeudi, oui, avec plaisir.*"
  - q: "Почему четверг — самый трудный день?"
    options: ["Бегают на холме.", "Бегают дольше всего.", "Бегают рано утром."]
    answer: 0
    explain: "*le jeudi, on court sur la colline. C'est le jour le plus difficile !*"
