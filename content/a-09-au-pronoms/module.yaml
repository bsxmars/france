title: "Урок 9. Au / aux, безличные глаголы, le / la / les, место наречия"
level: b1
book: book-pkk
summary: "Сливаешь à с артиклем (au, aux), говоришь «надо», «идёт дождь», «жарко», «десять часов», заменяешь дополнение местоимением le, la, les, ставишь наречие на место и вводишь прямую речь словами dit-il."
topics:
  - "Слитный артикль: à + le = au, à + les = aux"
  - "Безличные глаголы и обороты: il faut, il pleut, il fait chaud, il est dix heures"
  - "Местоимения-дополнения le, la, les: место перед глаголом"
  - "Место наречия: после глагола, но перед прилагательным и другим наречием"
  - "Предлог jusque: jusqu'à, jusqu'au, jusqu'ici"
  - "Инверсия после прямой речи: dit-il, dit le professeur"
sources:
  - {title: "Tex's French Grammar — Contractions of à and de with the definite article", url: "https://www.laits.utexas.edu/tex/gr/pre2.html"}
  - {title: "Tex's French Grammar — faire expressions", url: "https://www.laits.utexas.edu/tex/gr/virr6.html"}
  - {title: "Tex's French Grammar — Direct object pronouns", url: "https://www.laits.utexas.edu/tex/gr/pro5.html"}
  - {title: "Tex's French Grammar — Adverbs: formation and placement", url: "https://www.laits.utexas.edu/tex/gr/adv2.html"}
  - {title: "Le Point du FLE — La météo", url: "https://www.lepointdufle.net/p/lexique_meteo.htm"}
  - {title: "Le Point du FLE — Les pronoms compléments", url: "https://www.lepointdufle.net/p/pronomscomplements.htm"}
  - {title: "Le Point du FLE — Les adverbes", url: "https://www.lepointdufle.net/p/adverbes.htm"}
