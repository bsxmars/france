title: "Урок 17. Вопрос к подлежащему, числительные, -endre, voir"
level: b1
book: book-pkk
summary: "Спрашиваешь «кто?» и «что?» о подлежащем, считаешь до тысячи, спрягаешь глаголы на -endre, -ondre и глагол voir."
topics:
