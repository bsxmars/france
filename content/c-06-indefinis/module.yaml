title: "Глава. Неопределённые местоимения и прилагательные, même, tout"
level: c1
book: book-grammar
summary: "Различаешь тонкие пары неопределённых слов — chaque / chacun, aucun / nul, quelque / quelconque, d'autres / des autres, un tel / de tels, — уверенно употребляешь on, quiconque, autrui и n'importe qui в нужном регистре, отличаешь même-прилагательное от même-наречия и правильно согласуешь tout в роли местоимения, прилагательного и наречия (tout émue, но toute pâle)."
topics:
  - "On и l'on, согласование с on = nous; quelqu'un, quelques-uns, quelque, quelconque, chaque / chacun"
  - "Отрицательные неопределённые: aucun, nul, personne, rien (+ de + прилагательное); n'importe qui / quoi / lequel; quiconque, autrui"
  - "Autre (un autre, d'autres, l'un l'autre), certain, plusieurs, divers, tel (un tel, de tels, tel que, tel quel)"
  - "Même: прилагательное до и после существительного, местоимение le / la / les mêmes, наречие; устойчивые обороты"
  - "Tout: местоимение, прилагательное (tout le / tout un / tout без артикля), наречие и его согласование; tout … que"
sources:
  - {title: "Tex's French Grammar — Indefinite pronouns", url: "https://www.laits.utexas.edu/tex/gr/pro10.html"}
  - {title: "Tex's French Grammar — Indefinite determiners", url: "https://www.laits.utexas.edu/tex/gr/det10.html"}
  - {title: "Tex's French Grammar — Tout", url: "https://www.laits.utexas.edu/tex/gr/det9.html"}
  - {title: "Le Point du FLE — Tout, tous, toute, toutes", url: "https://www.lepointdufle.net/p/tout-tous-toute-toutes.htm"}
