title: "Входной тест B2 → C1"
level: c1
book: book-grammar
summary: "За полчаса узнаёшь, какие главы грамматики уже держатся, а на каких стоит задержаться: результат по каждому модулю c-01 … c-15 появится на странице «Прогресс»."
topics:
  - "45 вопросов — по три на каждый модуль c-01 … c-15 ступени B2 → C1"
  - "Существительное, артикль, прилагательное: женский род, исключения во мн. ч., bien des, ce n'est pas un, nouvel, цветовые прилагательные, moindre"
  - "Местоимения: нейтральное le, soi, m'en; dont, à qui, celui qui; chacun, tout, rien de + прилагательное"
  - "Наречие и отрицание; avoir / être, согласование причастия местоимённых глаголов; futur, futur dans le passé, futur antérieur"
  - "Passé simple, imparfait и passé composé; согласование времён, императив; conditionnel и si; subjonctif"
  - "Неличные формы и каузатив; косвенная речь, косвенный вопрос, c'est… qui"
  - "Как читать результаты на странице «Прогресс»"
sources:
  - {title: "DALF — формат экзамена и уровень C1 (France Éducation international)", url: "https://www.france-education-international.fr/diplome/dalf"}
  - {title: "Tex's French Grammar — Subjunctive summary", url: "https://www.laits.utexas.edu/tex/gr/tas7.html"}
  - {title: "Le Point du FLE — Indicatif ou subjonctif ?", url: "https://www.lepointdufle.net/ressources_fle/subjonctif_indicatif.htm"}
