title: "Урок 26. Qui, que; отрицания; глаголы группы mettre"
level: b1
book: book-pkk
summary: "Строишь определительные придаточные с qui и que, говоришь «никто, ничего, никогда, больше не, нигде, ни… ни» с правильным порядком слов и пользуешься глаголами mettre, permettre, promettre, remettre, transmettre."
topics:
  - "Относительные местоимения qui (подлежащее) и que (прямое дополнение)"
  - "Отрицания: ne … personne, rien, jamais, plus, nulle part, ni … ni; место в сложных временах и при инфинитиве, порядок нескольких отрицаний"
  - "Глаголы группы mettre: mettre, se mettre à, remettre, permettre, promettre, transmettre, compromettre"
sources:
  - {title: "Tex's French Grammar — Relative pronouns qui and que", url: "https://www.laits.utexas.edu/tex/gr/pror1.html"}
  - {title: "Tex's French Grammar — Negation: ne … jamais, rien, personne", url: "https://www.laits.utexas.edu/tex/gr/neg3.html"}
  - {title: "Tex's French Grammar — Negation: ne … aucun, ni … ni, que", url: "https://www.laits.utexas.edu/tex/gr/neg4.html"}
  - {title: "Tex's French Grammar — -re verbs like mettre", url: "https://www.laits.utexas.edu/tex/gr/vre3.html"}
  - {title: "Le Point du FLE — Pronoms relatifs", url: "https://www.lepointdufle.net/p/pronomsrelatifs.htm"}
  - {title: "Le Point du FLE — Négation", url: "https://www.lepointdufle.net/p/negation.htm"}
