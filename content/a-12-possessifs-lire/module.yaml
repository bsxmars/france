title: "Урок 12. Притяжательные и указательные прилагательные, глаголы III группы, lire, écrire"
level: b1
book: book-pkk
summary: "Говоришь «мой, наш, их» и «этот, эти» в любом роде и числе, понимаешь, как устроены глаголы III группы, и спрягаешь lire и écrire."
topics:
  - "Притяжательные прилагательные: полная таблица (mon… leurs)"
  - "Указательные прилагательные: ce, cet, cette, ces"
  - "Глаголы III группы: чередование основ, окончания -s, -s, -t"
  - "Спряжение глаголов lire и écrire"
sources:
  - {title: "Tex's French Grammar — Possessive determiners", url: "https://www.laits.utexas.edu/tex/gr/det6.html"}
  - {title: "Tex's French Grammar — Demonstrative determiners", url: "https://www.laits.utexas.edu/tex/gr/det7.html"}
  - {title: "Tex's French Grammar — dire, lire, écrire", url: "https://www.laits.utexas.edu/tex/gr/virr11.html"}
  - {title: "Tex's French Grammar — -ir verbs (irregular) like partir", url: "https://www.laits.utexas.edu/tex/gr/vir3.html"}
  - {title: "Le Point du FLE — Les adjectifs possessifs", url: "https://www.lepointdufle.net/p/possessifs.htm"}
  - {title: "Le Point du FLE — Les adjectifs démonstratifs", url: "https://www.lepointdufle.net/p/demonstratifs.htm"}
