title: "Повторение A. Уроки 1–16"
level: b1
book: book-pkk
summary: "Проверяешь грамматику фонетического курса — артикли, притяжательные и указательные слова, спряжение в настоящем времени, вопрос, отрицание, en и y — и видишь на «Прогрессе», к какому уроку вернуться."
topics:
  - "Артикль: определённый, неопределённый, слитный (du, des, au, aux); где артикля нет"
  - "Притяжательные и указательные прилагательные; «свой»"
  - "Être, avoir, aller, venir, faire, mettre, lire, écrire; глаголы I группы; форма tu и vous; повелительное наклонение"
  - "Порядок слов, вопрос (инверсия, est-ce que, qui, que, où), отрицание ne… pas"
  - "Прилагательное: род, число; il est… heures, il y a, c'est — ce sont, on, tout"
  - "Местоимения le, la, les; en и y; de после отрицания и слов количества"
