title: "Forum : un smartphone avant quinze ans ?"
type: writing
intro: "Напиши сообщение на форум по плану урока."
prompt: |
  Sur le forum d'un magazine pour parents, un lecteur écrit : « Mon fils de onze ans est le seul de sa classe sans smartphone. Faut-il interdire le smartphone aux enfants avant quinze ans ? »

  Vous répondez sur le forum en donnant votre opinion argumentée, appuyée sur des exemples précis.

  Напиши **200–280 слов**.
words: [200, 280]
target_grammar:
  - "вопрос с инверсией (простой и сложной), в том числе риторический"
  - "длительность: depuis, il y a, ça fait… que, pendant, en"
  - "причина: parce que, puisque, comme, grâce à / à cause de, à force de"
  - "следствие: donc, c'est pourquoi, si bien que, tellement… que"
checklist:
  - "Реакция на исходное сообщение и ясная позиция."
  - "Хотя бы один вопрос со сложной инверсией (Votre fils a-t-il… ?)."
  - "Два довода, у каждого — пример из жизни."
  - "Хотя бы три разные связки причины (не только parce que)."
  - "Хотя бы два выражения следствия, одно из них — si bien que или tellement… que."
  - "Длительность: depuis / ça fait… que и pendant / en употреблены верно."
  - "Уступка и вывод; вежливый регистр форума."
model_answer: |
  Bonjour à tous,

  Je réagis au message de Julien, car je me suis posé la même question il y a trois ans. Pour ma part, je ne suis pas favorable à une interdiction, mais je pense qu'il faut fixer des règles claires.

  D'abord, un enfant de onze ans a-t-il vraiment besoin d'un smartphone ? Pour appeler ses parents, un téléphone simple suffit. Le problème, ce n'est pas l'appareil, ce sont les applications. À force de regarder des vidéos courtes, ma fille aînée s'était tellement habituée aux écrans qu'elle n'arrivait plus à lire un livre pendant plus de dix minutes.

  Pourtant, interdire complètement le smartphone peut isoler un enfant. Puisque tous ses camarades organisent leurs sorties en ligne, celui qui n'en a pas risque de rester à l'écart. Mon fils cadet en a un depuis l'année dernière, et c'est grâce à ce téléphone qu'il a pu rejoindre l'équipe de football de son collège.

  La solution passe donc par un accord en famille. Chez nous, ça fait deux ans que les téléphones dorment dans la cuisine, si bien que plus personne ne les consulte au lit. Les réseaux sociaux sont autorisés seulement à partir de quinze ans, et nous en discutons régulièrement.

  Certes, ces règles demandent des efforts, et les disputes sont parfois inévitables. Mais comme les parents donnent l'exemple, les enfants les acceptent plus facilement. C'est pourquoi, plutôt qu'une loi, je conseillerais à Julien de choisir avec son fils des limites qu'ils respecteront tous les deux.

  Nathalie, mère de deux enfants
