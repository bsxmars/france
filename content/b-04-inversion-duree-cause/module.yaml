title: "Досье 4. Вопрос с инверсией, длительность, причина и следствие"
level: b2
book: book-cosmo
summary: "Задаёшь вопросы в стиле письменной и официальной речи (простая и сложная инверсия, -t-, отрицательный вопрос и ответ si), точно говоришь о длительности (depuis, il y a, ça fait… que, pendant, en, pour, dans) и строишь аргументацию через причину и следствие: parce que / puisque / comme, grâce à / à cause de, à force de, donc, c'est pourquoi, si bien que, tellement… que."
topics:
  - "Вопрос с инверсией: простая (подлежащее-местоимение) и сложная (существительное + il / elle), -t-, сложные времена, отрицание, ответ si"
  - "Длительность: il y a, depuis, ça fait / il y a … que, pendant, en, pour, dans"
  - "Причина: parce que, car, puisque, comme, en raison de, grâce à / à cause de, à force de, étant donné que, sous prétexte que"
  - "Следствие: donc, alors, c'est pourquoi, c'est pour cela que, par conséquent, si bien que, tellement / si … que, tant / tellement de … que"
sources:
  - {title: "Tex's French Grammar — Questions with subject/verb inversion", url: "https://www.laits.utexas.edu/tex/gr/int3.html"}
