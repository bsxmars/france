title: "Глава 2. Артикль"
level: c1
book: book-grammar
summary: "Выбираешь артикль по смыслу, а не по привычке: отличаешь общее значение (le courage), проявление качества (du courage) и его оттенок (un courage admirable), знаешь, когда артикль стоит перед именем собственным (le Paris des années folles, un Renoir, du Chopin) и когда его опускают (il est médecin, avec soin, ni frère ni sœur), и безошибочно ставишь de вместо артикля после количества, отрицания, перед прилагательным во мн. ч. и после глаголов и прилагательных с de — с исключениями вроде la plupart des, bien des, ce n'est pas un."
topics:
  - "Формы артикля: определённый, неопределённый, партитивный; слитные формы, элизия, h aspiré"
  - "Значения артикля: общее, конкретное, указательное; неопределённый как «любой» и как «одна из граней»; русский порядок слов вместо артикля"
  - "Артикль перед исчисляемыми, вещественными и абстрактными существительными; партитив в устойчивых сочетаниях (faire du sport, avoir du courage)"
  - "Артикль перед именами собственными; отсутствие артикля: профессия, приложение, перечисление, en, sans, avec, ni… ni…, устойчивые глагольные сочетания"
  - "Предлог de вместо артикля: количество, отрицание, прилагательное перед существительным во мн. ч., глаголы и прилагательные с de; исключения la plupart des, bien des, ce n'est pas un"
