title: "Входной тест B1 → B2"
level: b2
book: book-cosmo
summary: "За полчаса узнаёшь, какие темы досье 1–8 уже знаешь, а на каких стоит задержаться: результат по каждому досье появится на странице «Прогресс»."
topics:
  - "32 вопроса — по четыре на каждое досье 1–8 ступени B1 → B2"
  - "Participe présent, futur antérieur, уступка; времена прошедшего и гипотезы о прошлом"
  - "Сравнение, относительные местоимения, mise en relief, y и en; инверсия, длительность, причина и следствие"
  - "Пассив и subjonctif; условие, conditionnel, неопределённые слова, согласование причастия"
  - "Косвенная речь и двойные местоимения; subjonctif в относительных придаточных и после мнения, ne… ni… ni…"
  - "Как читать результаты на странице «Прогресс»"
sources:
  - {title: "DELF tout public — формат экзамена и уровень B2 (France Éducation international)", url: "https://www.france-education-international.fr/diplome/delf-tout-public"}
  - {title: "Le Point du FLE — грамматика по темам", url: "https://www.lepointdufle.net/p/apprendre_le_francais.htm"}
