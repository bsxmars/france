title: "Глава. Согласование времён и повелительное наклонение"
level: c1
book: book-grammar
summary: "Согласуешь время придаточного с прошедшим временем главного (imparfait, plus-que-parfait, futur dans le passé, futur antérieur dans le passé) и знаешь, когда согласование можно не соблюдать; уверенно строишь императив — неправильные формы, -s перед y и en, passé de l'impératif, вежливые формулы soutenu (veuillez, ayez l'obligeance) — и ставишь при нём одно или два местоимения в правильном порядке."
topics:
  - "Concordance des temps de l'indicatif: план настоящего и план прошедшего; одновременность, предшествование, следование; неизменяемые imparfait, plus-que-parfait и conditionnel; общеизвестные истины и факты, верные и сейчас"
  - "Mode impératif: формы, avoir / être / savoir / vouloir, -s у глаголов на -er перед y и en; значения — приказ, просьба, совет, пожелание, условие; passé de l'impératif; формулы вежливости"
  - "Императив и местоимения: порядок в утвердительной и отрицательной форме, moi / toi → m' / t' перед en, va-t'en, местоимение при инфинитиве (va le chercher, laisse-le partir)"
sources:
  - {title: "Le Point du FLE — Discours rapporté", url: "https://www.lepointdufle.net/p/discoursrapporte.htm"}
  - {title: "Tex's French Grammar — Imperative mood", url: "https://www.laits.utexas.edu/tex/gr/tai1.html"}
  - {title: "Tex's French Grammar — Order of object pronouns", url: "https://www.laits.utexas.edu/tex/gr/pro9.html"}
  - {title: "Le Point du FLE — Impératif", url: "https://www.lepointdufle.net/p/imperatif.htm"}
