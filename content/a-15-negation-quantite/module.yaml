title: "Урок 15. Cela, de после отрицания и количества, combien, avoir"
level: b1
book: book-pkk
summary: "Говоришь «у меня нет…», «много / мало / слишком много…» без лишнего артикля, спрашиваешь «сколько?» с правильным порядком слов, уверенно спрягаешь avoir и пользуешься местоимением cela."
topics:
  - "Местоимение cela (ça)"
  - "De вместо un, une, des после отрицания"
  - "De без артикля после combien, beaucoup, peu, assez, trop"
  - "Порядок слов в вопросе с combien"
  - "Глагол avoir: настоящее время и повелительное наклонение"
sources:
  - {title: "Tex's French Grammar — Indefinite articles", url: "https://www.laits.utexas.edu/tex/gr/det4.html"}
  - {title: "Tex's French Grammar — Expressions of quantity", url: "https://www.laits.utexas.edu/tex/gr/det8.html"}
  - {title: "Tex's French Grammar — avoir", url: "https://www.laits.utexas.edu/tex/gr/virr2.html"}
  - {title: "Le Point du FLE — La négation", url: "https://www.lepointdufle.net/p/negation.htm"}
