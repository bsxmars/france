title: "Итоговый тест B1 → B2"
level: b2
book: book-cosmo
summary: "Проверяешь грамматику всей ступени в формате DELF B2 — 40 вопросов, по пять на каждое досье 1–8 — и сравниваешь на «Прогрессе» результат с входным тестом по тем же темам."
topics:
  - "40 вопросов — по пять на каждое досье 1–8, новые предложения, ловушки уровня B2"
  - "Adjectif verbal, participe composé, futur antérieur, уступка; времена прошедшего, passé simple, предлоги места"
  - "Lequel / duquel, ce dont, moindre, de lui; инверсия, длительность, причина и следствие"
  - "Пассив и se faire, espérer, альтернатива с subjonctif; условие, conditionnel journalistique, aucun, согласование причастия"
  - "Косвенная речь в прошлом, двойные местоимения и императив; subjonctif в относительных придаточных, вероятность, ni… ni…"
  - "Сравнение с входным тестом на странице «Прогресс»"
sources:
  - {title: "DELF tout public — формат экзамена и уровень B2 (France Éducation international)", url: "https://www.france-education-international.fr/diplome/delf-tout-public"}
  - {title: "Le Point du FLE — Subjonctif", url: "https://www.lepointdufle.net/p/subjonctif.htm"}
  - {title: "Le Point du FLE — Relations logiques", url: "https://www.lepointdufle.net/p/relationslogiques.htm"}
