title: "Урок 19. Местоименные глаголы, особенности I группы, prendre"
level: b1
book: book-pkk
summary: "Спрягаешь местоименные глаголы (je me lève, ne te dépêche pas !, je dois me lever), пишешь без ошибок nous commençons, nous mangeons, il achète, j'appelle, je répète и спрягаешь prendre, comprendre, apprendre."
topics:
  - "Местоименные глаголы: спряжение, отрицание, вопрос, повелительное наклонение, инфинитив после другого глагола"
  - "Особенности глаголов I группы: -cer, -ger, -guer; répéter, lever, acheter; appeler, jeter"
  - "Глаголы типа prendre: prendre, comprendre, apprendre"
sources:
  - {title: "Tex's French Grammar — Pronominal verbs", url: "https://www.laits.utexas.edu/tex/gr/vpr1.html"}
  - {title: "Tex's French Grammar — -er verbs (stem changing)", url: "https://www.laits.utexas.edu/tex/gr/ver2.html"}
  - {title: "Tex's French Grammar — -re verbs like prendre", url: "https://www.laits.utexas.edu/tex/gr/vre2.html"}
