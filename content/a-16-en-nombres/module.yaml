title: "Урок 16. Местоимение en, числительные до 69, être, mettre"
level: b1
book: book-pkk
summary: "Отвечаешь «да, у меня их три», «нет, у меня его нет» с местоимением en, считаешь до 69 и правильно произносишь числа перед существительным, спрягаешь être и mettre, включая повелительное наклонение."
topics:
  - "Местоимение en вместо дополнения с un, une, des, de и словами количества"
  - "Количественные числительные от 1 до 69"
  - "Глагол être: настоящее время и повелительное наклонение (sois, soyons, soyez)"
  - "Глагол mettre"
sources:
  - {title: "Tex's French Grammar — Pronoun en", url: "https://www.laits.utexas.edu/tex/gr/pro7.html"}
  - {title: "Tex's French Grammar — être", url: "https://www.laits.utexas.edu/tex/gr/virr1.html"}
  - {title: "Tex's French Grammar — -re verbs (irregular) like mettre", url: "https://www.laits.utexas.edu/tex/gr/vre3.html"}
  - {title: "Le Point du FLE — Les nombres", url: "https://www.lepointdufle.net/p/lexique_nombres.htm"}
  - {title: "Le Point du FLE — L'impératif", url: "https://www.lepointdufle.net/p/imperatif.htm"}
