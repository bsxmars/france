title: "Урок 5. Притяжательные, элизия, артикль, отрицание, предлоги de и à"
level: b1
book: book-pkk
summary: "Выбираешь притяжательное слово по лицу владельца (и передаёшь русское «свой»), делаешь элизию, называешь профессию без артикля, говоришь о себе в форме je, строишь отрицание ne… pas и связываешь слова предлогами de и à."
topics:
  - "Притяжательные прилагательные: лицо владельца, leur / leurs, перевод «свой»"
  - "Элизия: l', j', c', n', d', qu'"
  - "Определённый артикль le, la, l', les; профессия после être без артикля"
  - "1-е лицо ед. ч. глаголов I и III группы: je parle, je lis"
  - "Отрицание ne… pas"
  - "Предлоги de и à"
sources:
  - {title: "Tex's French Grammar — Possessive determiners", url: "https://www.laits.utexas.edu/tex/gr/det6.html"}
  - {title: "Tex's French Grammar — Definite articles", url: "https://www.laits.utexas.edu/tex/gr/det2.html"}
  - {title: "Tex's French Grammar — c'est vs. il/elle est", url: "https://www.laits.utexas.edu/tex/gr/pro3.html"}
  - {title: "Tex's French Grammar — Basic negation: ne… pas", url: "https://www.laits.utexas.edu/tex/gr/neg2.html"}
  - {title: "Tex's French Grammar — Introduction to prepositions", url: "https://www.laits.utexas.edu/tex/gr/pre1.html"}
  - {title: "Le Point du FLE — Les adjectifs possessifs", url: "https://www.lepointdufle.net/p/possessifs.htm"}
  - {title: "Le Point du FLE — La négation", url: "https://www.lepointdufle.net/p/negation.htm"}
  - {title: "Le Point du FLE — Les prépositions", url: "https://www.lepointdufle.net/p/prepositions.htm"}
