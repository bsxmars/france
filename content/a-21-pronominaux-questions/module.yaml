title: "Урок 21. Местоименные глаголы в passé composé, вопрос к дополнению, même, место прилагательных, partir"
level: b1
book: book-pkk
summary: "Рассказываешь в passé composé с местоименными глаголами (elle s'est levée, ils se sont lavé les mains), задаёшь вопросы «кого? что? кому? о чём? с кем?», различаешь même «тот же» и «даже», ставишь прилагательное до или после существительного и спрягаешь partir, sortir, dormir, sentir."
topics:
  - "Местоименные глаголы в passé composé: вспомогательный être, согласование причастия"
  - "Вопрос к прямому дополнению: que, qu'est-ce que, qui, qui est-ce que"
  - "Вопрос к косвенному дополнению: à qui, de qui, avec quoi…"
  - "Même — прилагательное («тот же») и наречие («даже»)"
  - "Место прилагательного-определения"
  - "Глаголы типа partir: partir, sortir, dormir, sentir, servir, mentir"
sources:
  - {title: "Tex's French Grammar — Passé composé of pronominal verbs", url: "https://www.laits.utexas.edu/tex/gr/tap4.html"}
  - {title: "Tex's French Grammar — Interrogative pronouns", url: "https://www.laits.utexas.edu/tex/gr/int5.html"}
  - {title: "Tex's French Grammar — Adjectives: formation and placement", url: "https://www.laits.utexas.edu/tex/gr/adj2.html"}
  - {title: "Tex's French Grammar — Adjectives before the noun", url: "https://www.laits.utexas.edu/tex/gr/adj3.html"}
  - {title: "Tex's French Grammar — -ir verbs like partir", url: "https://www.laits.utexas.edu/tex/gr/vir3.html"}
  - {title: "Tex's French Grammar — quitter, partir, sortir, laisser", url: "https://www.laits.utexas.edu/tex/gr/vl1.html"}
