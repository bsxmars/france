title: "Урок 27. Plus-que-parfait, женский род, -uire, pleuvoir, falloir"
level: b1
book: book-pkk
summary: "Рассказываешь о том, что случилось раньше другого прошедшего события (plus-que-parfait), образуешь женский род существительных и прилагательных, спрягаешь traduire, conduire, construire, а также безличные pleuvoir и falloir во всех пройденных временах."
topics:
  - "Plus-que-parfait: образование и употребление (предшествование в прошлом)"
  - "Женский род существительных: -e, удвоение согласной, -f → -ve, -er → -ère, суффиксы -euse, -trice, -esse"
  - "Женский род прилагательных: общие правила и особые формы (belle, vieille, blanche, longue…)"
  - "Глаголы на -uire; безличные глаголы pleuvoir и falloir"
sources:
  - {title: "Tex's French Grammar — Plus-que-parfait", url: "https://www.laits.utexas.edu/tex/gr/tap9.html"}
  - {title: "Tex's French Grammar — Gender: masculine, feminine", url: "https://www.laits.utexas.edu/tex/gr/no3.html"}
  - {title: "Tex's French Grammar — Irregular adjectives", url: "https://www.laits.utexas.edu/tex/gr/adj4.html"}
  - {title: "Tex's French Grammar — Impersonal verbs: il faut", url: "https://www.laits.utexas.edu/tex/gr/vim1.html"}
  - {title: "Le Point du FLE — Plus-que-parfait", url: "https://www.lepointdufle.net/p/plus-que-parfait.htm"}
