title: "Урок 29. Частичный артикль, страдательный залог, множественное число, -frir/-vrir, devoir"
level: b1
book: book-pkk
summary: "Говоришь «купи хлеба» и «не пью кофе» с нужным артиклем, строишь страдательный залог во всех основных временах (la maison a été construite par…), образуешь трудные формы множественного числа и спрягаешь ouvrir, offrir, souffrir и devoir."
topics:
  - "Частичный артикль du, de la, de l': употребление и замена на de"
  - "Страдательная форма: être + participe passé, предлоги par и de"
  - "Множественное число существительных"
  - "Глаголы на -frir, -vrir (ouvrir, couvrir, offrir, souffrir); глагол devoir"
sources:
  - {title: "Tex's French Grammar — Partitive articles", url: "https://www.laits.utexas.edu/tex/gr/det5.html"}
  - {title: "Tex's French Grammar — Expressions of quantity", url: "https://www.laits.utexas.edu/tex/gr/det8.html"}
  - {title: "Tex's French Grammar — Active voice vs. passive voice", url: "https://www.laits.utexas.edu/tex/gr/tav1.html"}
  - {title: "Le Point du FLE — Passif, actif", url: "https://www.lepointdufle.net/p/passif.htm"}
  - {title: "Tex's French Grammar — Number: singular and plural", url: "https://www.laits.utexas.edu/tex/gr/no2.html"}
  - {title: "Tex's French Grammar — -ir verbs like ouvrir", url: "https://www.laits.utexas.edu/tex/gr/vir2.html"}
  - {title: "Tex's French Grammar — Modal verbs: vouloir, pouvoir, devoir", url: "https://www.laits.utexas.edu/tex/gr/vm1.html"}
