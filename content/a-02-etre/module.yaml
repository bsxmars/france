title: "Урок 2. Мой, этот; être; c'est"
level: b1
book: book-pkk
summary: "Говоришь «мой, твой, его», «этот, эта» в нужном роде, спрягаешь être и представляешь людей и предметы оборотом c'est."
topics:
  - "Местоименные прилагательные: притяжательные (ma, ta, sa; mon, ton, son) и указательные (ce, cet, cette)"
  - "Глагол être: обязательная связка, спряжение в настоящем времени"
  - "Оборот c'est и вопрос est-ce… ?"
sources:
  - {title: "Tex's French Grammar — Possessive determiners", url: "https://www.laits.utexas.edu/tex/gr/det6.html"}
  - {title: "Tex's French Grammar — Demonstrative determiners", url: "https://www.laits.utexas.edu/tex/gr/det7.html"}
  - {title: "Tex's French Grammar — être", url: "https://www.laits.utexas.edu/tex/gr/virr1.html"}
  - {title: "Tex's French Grammar — c'est vs. il/elle est", url: "https://www.laits.utexas.edu/tex/gr/pro3.html"}
