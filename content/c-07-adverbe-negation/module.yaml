title: "Глава. Наречие и отрицание"
level: c1
book: book-grammar
summary: "Безошибочно образуешь наречия на -ment, -amment, -emment, включая исключения (profondément, gentiment, brièvement, assidûment), ставишь их на нужное место и сравниваешь (mieux, davantage, le plus tôt possible); владеешь всей системой отрицания — от ne… plus jamais rien до книжных ne… point, ne… guère, nullement, ne без pas после cesser, oser, pouvoir, savoir и ne explétif; различаешь ne… que, ne… pas que, il n'y a que… qui и ne faire que."
topics:
  - "Наречия на -ment: образование от женского рода, от мужского на гласную, -ément, gentiment, brièvement / grièvement; -amment, -emment и их произношение"
  - "Степени сравнения наречий: mieux, pis / plus mal, davantage, le plus… possible, plus… plus…; место наречия в предложении"
  - "Отрицания personne, rien, aucun, jamais, plus, nulle part, ni… ni: место в сложных временах и при инфинитиве, сочетания отрицаний, положительный смысл rien, personne, jamais"
  - "Отрицание в высоком регистре: ne… point, ne… guère, nullement, aucunement, ne без pas (cesser, oser, pouvoir, savoir), ne explétif; non и pas"
  - "Ограничение: ne… que, il n'y a que… qui, ne faire que + infinitif, ne… pas que, seul и seulement"
