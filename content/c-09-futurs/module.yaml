title: "Глава. Présent и будущие времена"
level: c1
book: book-grammar
summary: "Различаешь значения présent (актуальное, общее, длительное с depuis, ближайшее будущее и только что совершившееся, présent de narration), без ошибок образуешь futur simple трудных глаголов и выбираешь между ним и futur immédiat; употребляешь futur simple для приказа, вежливой просьбы и исторической перспективы; в плане прошлого переходишь к futur dans le passé, allait + infinitif и futur antérieur dans le passé; используешь futur antérieur для предшествования, завершённости к сроку и предположения (il aura oublié)."
topics:
  - "Présent: актуальный, общий (présent de vérité générale), с depuis / il y a… que, вместо будущего и недавнего прошлого, présent de narration, после si"
  - "Futur simple: образование (appeler, jeter, acheter, -yer, envoyer, cueillir, acquérir), значения: будущее, приказ, вежливость, историческая перспектива; futur immédiat и его отличия"
  - "Futur dans le passé и futur immédiat dans le passé (allait + infinitif): согласование времён, несостоявшееся действие"
  - "Futur antérieur и futur antérieur dans le passé: предшествование, завершённость к сроку, предположение, итог"
