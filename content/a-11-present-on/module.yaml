  - {title: "Tex's French Grammar — Imperative mood", url: "https://www.laits.utexas.edu/tex/gr/tai1.html"}
  - {title: "Tex's French Grammar — Subject pronouns", url: "https://www.laits.utexas.edu/tex/gr/pro2.html"}
  - {title: "Tex's French Grammar — c'est vs. il/elle est", url: "https://www.laits.utexas.edu/tex/gr/pro3.html"}
  - {title: "Le Point du FLE — Le présent", url: "https://www.lepointdufle.net/p/present.htm"}
  - {title: "Le Point du FLE — L'impératif", url: "https://www.lepointdufle.net/p/imperatif.htm"}
