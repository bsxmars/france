title: "Урок 11. C'est — ce sont, on, глаголы I группы"
level: b1
book: book-pkk
summary: "Говоришь «это» о нескольких предметах (ce sont), строишь фразы с on («говорят», «мы»), спрягаешь любой глагол на -er в утверждении, отрицании и вопросе и отдаёшь команды в повелительном наклонении."
topics:
  - "Конструкция c'est — ce sont: утверждение, отрицание, вопрос"
  - "Неопределённо-личное местоимение on"
  - "Глаголы I группы в настоящем времени: утвердительная, отрицательная и вопросительная форма"
  - "Повелительное наклонение глаголов I группы"
sources:
