title: "Урок 20. Passé composé, место наречий, множественное число на -aux, connaître"
level: b1
book: book-pkk
summary: "Рассказываешь о прошедших событиях в passé composé: выбираешь avoir или être, образуешь причастия, согласуешь их с подлежащим, строишь отрицание и вопрос, ставишь на место местоимения и наречия; пишешь des journaux, des tableaux, des pays internationaux и спрягаешь connaître."
topics:
  - "Passé composé: образование с avoir и être, participe passé, согласование с подлежащим, отрицание, вопрос, местоимения"
  - "Место наречий при глаголе в сложном времени"
  - "Множественное число существительных на -eu, -eau, -al"
  - "Множественное число прилагательных на -al и -eau"
  - "Глагол connaître"
sources:
  - {title: "Tex's French Grammar — Passé composé with avoir", url: "https://www.laits.utexas.edu/tex/gr/tap2.html"}
  - {title: "Tex's French Grammar — Passé composé with être", url: "https://www.laits.utexas.edu/tex/gr/tap3.html"}
  - {title: "Tex's French Grammar — Placement of adverbs with the passé composé", url: "https://www.laits.utexas.edu/tex/gr/adv3.html"}
  - {title: "Tex's French Grammar — Number: singular, plural", url: "https://www.laits.utexas.edu/tex/gr/no2.html"}
  - {title: "Tex's French Grammar — Irregular adjectives", url: "https://www.laits.utexas.edu/tex/gr/adj4.html"}
  - {title: "Tex's French Grammar — Savoir vs. connaître", url: "https://www.laits.utexas.edu/tex/gr/virr10.html"}
