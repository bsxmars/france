title: "Глава. Переходность, пассив, местоимённые глаголы"
level: c1
book: book-grammar
summary: "Различаешь прямую и косвенную переходность там, где русский язык подсказывает неверно (aider qn, obéir à qn, se souvenir de / se rappeler qch), выбираешь avoir или être у monter, sortir, passer, rentrer, retourner, demeurer; строишь пассив во всех временах, выбираешь par или de перед агентом и знаешь, когда пассив невозможен; различаешь возвратные, взаимные, собственно местоимённые глаголы и местоимённый пассив и безошибочно согласуешь их причастие (elles se sont lavées / lavé les mains, ils se sont parlé, elle s'est rendu compte)."
topics:
  - "Переходные (прямые и косвенные) и непереходные глаголы; расхождения с русским; глаголы с avoir и être (monter, descendre, sortir, rentrer, passer, retourner, demeurer)"
  - "Forme passive: образование во всех временах, par и de перед агентом, ограничения пассива, пассив состояния и действия"
  - "Местоимённые глаголы: réfléchis и réciproques, роль se (COD или COI) и согласование причастия"
  - "Собственно местоимённые глаголы (s'enfuir, se souvenir, s'évanouir), глаголы с изменением смысла (se douter, s'apercevoir, se plaindre), местоимённый пассив (ça se dit, ça ne se fait pas)"
sources:
  - {title: "Tex's French Grammar — Active voice vs. passive voice", url: "https://www.laits.utexas.edu/tex/gr/tav1.html"}
  - {title: "Tex's French Grammar — Pronominal verbs", url: "https://www.laits.utexas.edu/tex/gr/vpr1.html"}
  - {title: "Tex's French Grammar — Passé composé of pronominal verbs", url: "https://www.laits.utexas.edu/tex/gr/tap4.html"}
  - {title: "Tex's French Grammar — Passé composé with être", url: "https://www.laits.utexas.edu/tex/gr/tap3.html"}
  - {title: "Le Point du FLE — Passif, actif", url: "https://www.lepointdufle.net/p/passif.htm"}
  - {title: "Le Point du FLE — Passé composé", url: "https://www.lepointdufle.net/p/passecompose.htm"}
