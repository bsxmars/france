title: "Урок 4. Порядок слов, имена городов, глаголы III группы, вопрос qui"
level: b1
book: book-pkk
summary: "Ставишь дополнение после глагола, называешь города без артикля, образуешь 3-е лицо глаголов III группы (il lit — ils lisent) и спрашиваешь о подлежащем: Qui lit ?"
topics:
