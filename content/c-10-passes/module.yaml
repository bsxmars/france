title: "Глава. Прошедшие времена индикатива"
level: c1
book: book-grammar
summary: "Свободно читаешь литературный рассказ: узнаёшь любые формы passé simple и passé antérieur, понимаешь, где автор переходит на passé composé и почему; выбираешь imparfait или passé composé не по русскому виду, а по тому, ограничено ли действие; знаешь «особые» imparfait — предложение с si, смягчение, нарративный и гипотетический imparfait; точно передаёшь предшествование — plus-que-parfait, venait de, à peine… que."
topics:
  - "Passé simple: все типы форм, редкие и омонимичные формы (fut / fût, vit, plut), особый смысл eut, fut, sut, put, connut; passé simple и passé composé — письменный рассказ и связь с настоящим"
  - "Imparfait: длительность, повторение, описание, одновременность; особые случаи — si + imparfait (предложение), imparfait d'atténuation, imparfait de narration, imparfait hypothétique"
  - "Imparfait — passé simple — passé composé: ограниченная длительность, констатация факта, глаголы, меняющие смысл (savoir, pouvoir, vouloir, devoir, connaître)"
  - "Предшествование в прошлом: plus-que-parfait, passé immédiat, plus-que-parfait immédiat, passé antérieur; à peine… que, dès que, aussitôt que; après que + indicatif"
sources:
