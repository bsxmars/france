title: "Урок 22. Imparfait, согласование причастия, le, причина, pouvoir и vouloir"
level: b1
book: book-pkk
summary: "Описываешь прошлое и привычки в imparfait и отличаешь его от passé composé, согласуешь причастие с дополнением перед глаголом, говоришь «я это знаю» через le, объясняешь причину (comme, parce que, car), спрашиваешь pourquoi и уверенно спрягаешь pouvoir и vouloir."
topics:
  - "Imparfait: образование и употребление, imparfait и passé composé, si on allait… ?"
  - "Согласование participe passé глаголов с avoir с прямым дополнением, стоящим впереди"
  - "Местоимение le в значении «это»"
  - "Союзы причины comme, parce que, car; вопрос pourquoi"
  - "Глаголы pouvoir и vouloir"
sources:
  - {title: "Tex's French Grammar — Imparfait: formation", url: "https://www.laits.utexas.edu/tex/gr/tap5.html"}
  - {title: "Tex's French Grammar — Passé composé vs. imparfait", url: "https://www.laits.utexas.edu/tex/gr/tap8.html"}
  - {title: "Tex's French Grammar — Direct object pronouns", url: "https://www.laits.utexas.edu/tex/gr/pro5.html"}
  - {title: "Tex's French Grammar — Subordinating conjunctions", url: "https://www.laits.utexas.edu/tex/gr/con3.html"}
  - {title: "Tex's French Grammar — Modal verbs", url: "https://www.laits.utexas.edu/tex/gr/vm1.html"}
  - {title: "Le Point du FLE — Imparfait", url: "https://www.lepointdufle.net/p/imparfait.htm"}
