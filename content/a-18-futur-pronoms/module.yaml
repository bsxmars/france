title: "Урок 18. Futur et passé immédiats, местоимения-дополнения, порядковые числительные, II группа, savoir"
level: b1
book: book-pkk
summary: "Говоришь «я сейчас сделаю» и «я только что сделал», заменяешь дополнения местоимениями le, la, lui, leur и ставишь их на место, называешь порядковые числа, спрягаешь глаголы II группы и savoir."
topics:
  - "Futur immédiat (aller + infinitif) и passé immédiat (venir de + infinitif)"
  - "Личные приглагольные местоимения: подлежащее, прямое и косвенное дополнение; их место"
  - "De без артикля после существительных количества"
  - "Порядковые числительные"
  - "Глаголы II группы (finir)"
  - "Глагол savoir"
sources:
  - {title: "Tex's French Grammar — Futur proche", url: "https://www.laits.utexas.edu/tex/gr/taf1.html"}
  - {title: "Tex's French Grammar — Passé immédiat", url: "https://www.laits.utexas.edu/tex/gr/tap1.html"}
