  - {title: "Tex's French Grammar — Indirect object pronouns", url: "https://www.laits.utexas.edu/tex/gr/pro8.html"}
  - {title: "Tex's French Grammar — Expressions of quantity", url: "https://www.laits.utexas.edu/tex/gr/det8.html"}
  - {title: "Tex's French Grammar — -ir verbs (regular)", url: "https://www.laits.utexas.edu/tex/gr/vir1.html"}
  - {title: "Tex's French Grammar — savoir vs. connaître", url: "https://www.laits.utexas.edu/tex/gr/virr10.html"}
