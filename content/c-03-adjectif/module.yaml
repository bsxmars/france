title: "Глава 3. Имя прилагательное"
level: c1
book: book-grammar
summary: "Без запинки образуешь женский род и множественное число прилагательных, включая редкие формы (bénigne, coite, aiguë, vengeresse, banals, navals), знаешь, когда нужны bel, nouvel, vieil и как согласуются прилагательные цвета (des yeux bleu clair, des rideaux orange); сравниваешь тонко (pire и plus mauvais, moindre и plus petit, c'est le matin qu'elle est le plus calme, une affaire des plus délicates), выбираешь место прилагательного с учётом смысла (un ancien élève — un meuble ancien) и стиля, употребляешь прилагательные в роли наречий (coûter cher, parler bas) и quel — в вопросе, восклицании и в quel que soit."
topics:
  - "Женский род прилагательных: общее правило, удвоение согласной, -ète, -euse / -trice / -eresse, особые формы (blanche, sèche, fraîche, grecque, bénigne, aiguë)"
  - "Две формы мужского рода: beau / bel, nouveau / nouvel, vieux / vieil, fou / fol, mou / mol"
  - "Множественное число и согласование: -aux и исключения (banals, fatals, navals), прилагательные цвета, demi, nu, согласование с несколькими существительными"
  - "Степени сравнения: comparatif и superlatif, meilleur, pire / plus mauvais, moindre / plus petit, le plus неизменяемое, des plus + прилагательное"
  - "Место прилагательного и изменение смысла (ancien, cher, propre, seul, dernier, grand); стилистическая препозиция"
  - "Прилагательные в роли наречий (coûter cher, parler bas, s'arrêter net); quel вопросительное и восклицательное, quel que soit"
