title: "Урок 23. Futur simple, si + présent, вопросительно-отрицательная форма, tout, dire"
level: b1
book: book-pkk
summary: "Говоришь о будущем в futur simple, строишь условие «если… то…» с si + présent, задаёшь вопросы «разве не…?» и отвечаешь на них si, употребляешь tout «всё» и спрягаешь dire и interdire."
topics:
  - "Futur simple: образование, особые основы, употребление"
  - "Придаточное условия: si + présent, в главном — futur или повелительное наклонение"
  - "Вопросительно-отрицательная форма; ответ si"
  - "Неопределённое местоимение tout «всё»"
  - "Глаголы типа dire; dire à qn de faire, interdire"
sources:
  - {title: "Tex's French Grammar — Simple future (regular)", url: "https://www.laits.utexas.edu/tex/gr/taf2.html"}
  - {title: "Tex's French Grammar — Simple future (irregular)", url: "https://www.laits.utexas.edu/tex/gr/taf3.html"}
  - {title: "Tex's French Grammar — Si clauses: summary", url: "https://www.laits.utexas.edu/tex/gr/tac3.html"}
  - {title: "Tex's French Grammar — tout", url: "https://www.laits.utexas.edu/tex/gr/det9.html"}
