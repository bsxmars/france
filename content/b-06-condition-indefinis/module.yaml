title: "Досье 6. Условие, conditionnel, неопределённые слова, согласование причастия"
level: b2
book: book-cosmo
summary: "Ставишь условия не только через si (à condition que, pourvu que, à moins que, au cas où, en cas de) и выбираешь после них наклонение; смягчаешь просьбы и утверждения conditionnel, подаёшь непроверенную информацию как журналист, упрекаешь и сожалеешь в conditionnel passé (tu aurais dû, j'aurais aimé); точно называешь количество словами chaque, chacun, aucun, certains, plusieurs, n'importe qui, tout; согласуешь participe passé с прямым дополнением, стоящим перед avoir."
topics:
  - "Условие: si + indicatif; à condition que / pourvu que / à moins que + subjonctif; à condition de, à moins de + infinitif; au cas où + conditionnel; en cas de, avec, sans + существительное"
  - "Conditionnel présent: смягчение, совет, гипотеза, непроверенная информация (conditionnel journalistique)"
  - "Conditionnel passé: упрёк и сожаление (j'aurais dû, tu aurais pu, il aurait fallu, j'aurais aimé, j'aurais préféré)"
  - "Неопределённые прилагательные и местоимения: chaque / chacun, aucun, certains, plusieurs, quelques-uns, la plupart, n'importe qui / quoi / où, tout / tous / toutes"
  - "Accord du participe passé с COD, стоящим перед avoir (le, la, les, que, combien de, quel)"
