title: "Глава 1. Имя существительное"
level: c1
book: book-grammar
summary: "Уверенно образуешь женский род одушевлённых существительных — от cadette и préfète до impératrice, cantatrice и современных autrice, cheffe, professeure; не путаешь род у «коварных» слов (un orage, une oasis, le pétale) и у омонимов вроде le mémoire / la mémoire; знаешь исключения во множественном числе (vitraux, festivals, aïeux / aïeuls, cieux / ciels) и умеешь ставить во множественное число составные и заимствованные слова — по традиции и по орфографической реформе 1990 года."
topics:
  - "Разряды существительных: исчисляемые и неисчисляемые (вещественные, абстрактные), собственные, собирательные, составные"
  - "Женский род одушевлённых существительных: окончание, суффикс (-euse, -trice, -esse), только детерминатив, особое слово; феминизация названий профессий"
  - "Род неодушевлённых существительных: слова-ловушки, омонимы, различающиеся родом (le tour / la tour), amour, délice, orgue, gens"
  - "Множественное число: -s, -x, -al / -aux, -ail / -aux, -ou / -oux и исключения; двойные формы (aïeux / aïeuls, cieux / ciels, yeux / œils)"
  - "Множественное число составных существительных и заимствований; рекомендации реформы 1990 года"
sources:
  - {title: "Tex's French Grammar — Introduction to nouns", url: "https://www.laits.utexas.edu/tex/gr/no1.html"}
  - {title: "Tex's French Grammar — Gender: masculine, feminine", url: "https://www.laits.utexas.edu/tex/gr/no3.html"}
  - {title: "Tex's French Grammar — Number: singular, plural", url: "https://www.laits.utexas.edu/tex/gr/no2.html"}
  - {title: "Le Point du FLE — Les noms", url: "https://www.lepointdufle.net/p/noms.htm"}
