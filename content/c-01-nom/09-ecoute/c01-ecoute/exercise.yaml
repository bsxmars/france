title: "Les mots du jour : comment un mot entre au dictionnaire"
type: listening
intro: "Послушай радиоинтервью (дважды, как на DALF) и ответь на вопросы."
hints:
  - "Pas vraiment, en réalité — сигналы, что гостья опровергает распространённое мнение."
  - "Род auteure / auteur на слух различается только по артиклю."
audio: audio/tts/c-01/interview.mp3
audio_source: {title: "Enregistrement du cours (edge-tts)", url: "https://github.com/rany2/edge-tts", author: "fr-FR-DeniseNeural, fr-CA-SylvieNeural", license: "TTS"}
transcript: |
  **Journaliste :** Bonjour et bienvenue dans « Les mots du jour ». Chaque année, les grands dictionnaires accueillent des centaines de mots nouveaux. Pour en parler, nous recevons Nathalie Bergeron, lexicographe à Montréal, qui a participé à la rédaction de plusieurs dictionnaires. Nathalie Bergeron, comment un mot entre-t-il dans le dictionnaire ?

  **Nathalie Bergeron :** Il faut d'abord qu'il circule. Nous ne créons pas les mots, nous les observons. Notre équipe dépouille chaque année des milliers d'articles de presse, de romans, d'émissions de radio. Quand un mot apparaît souvent, chez des auteurs variés, et pendant plusieurs années, il devient candidat. Un mot à la mode qui disparaît au bout de six mois n'a aucune chance.

  **Journaliste :** Parmi les nouveaux venus, il y a beaucoup de féminins : autrice, cheffe, pompière… Ce sont des mots nouveaux ?

  **Nathalie Bergeron :** Pas vraiment, et c'est ce qui est intéressant. Au Québec, on dit « une auteure » ou « une professeure » depuis plus de quarante ans. En France, ces formes se sont répandues beaucoup plus tard. Le dictionnaire ne fait qu'enregistrer ce que les locuteurs ont décidé. Quand une journaliste écrit « une cheffe d'entreprise » et que des milliers de lecteurs font comme elle, notre rôle est de le constater.

  **Journaliste :** Mais alors, qui décide si l'on écrit « auteure » ou « autrice » ?

  **Nathalie Bergeron :** Personne, et tout le monde ! Les deux formes coexistent. Au Québec, « auteure » reste majoritaire ; en France, « autrice » l'emporte nettement chez les jeunes. Nous indiquons les deux, avec leur fréquence. Un dictionnaire n'est pas un tribunal.

  **Journaliste :** Autre sujet sensible : les mots anglais. On reproche souvent aux dictionnaires d'accueillir trop d'anglicismes.

  **Nathalie Bergeron :** En réalité, les emprunts représentent une petite partie des entrées nouvelles. Et surtout, un mot emprunté ne reste pas étranger longtemps : il reçoit un genre et un pluriel français. On écrit des sandwichs, des matchs, des scénarios, et de moins en moins des sandwiches ou des scenarii. Les rectifications de 1990 recommandaient justement de traiter les emprunts comme des mots français.

  **Journaliste :** Et le genre ? Pourquoi dit-on un e-mail, mais une start-up ?

  **Nathalie Bergeron :** Souvent par analogie avec le mot français le plus proche. Un e-mail, parce qu'on pense à un courrier ; une start-up, parce qu'on pense à une entreprise. Mais il y a des hésitations : chez nous, au Québec, on dit « une job », là où les Français disent « un job ».

  **Journaliste :** Et les mots composés ? Leur pluriel est un cauchemar pour les élèves.

  **Nathalie Bergeron :** Pour nous aussi ! Prenez un après-midi : on écrit traditionnellement des après-midi, sans s, mais la réforme accepte des après-midis. Ou un chef-d'œuvre : le pluriel reste des chefs-d'œuvre, parce que « d'œuvre » est un complément. Le principe est logique : on ne met la marque du pluriel que sur les éléments qui peuvent varier, c'est-à-dire les noms et les adjectifs. Le problème, c'est que l'usage, lui, n'a pas toujours été logique.

  **Journaliste :** Est-ce qu'il vous arrive aussi de retirer des mots ?

  **Nathalie Bergeron :** Beaucoup plus rarement qu'on ne le croit. Un mot vieilli reste utile pour lire les classiques : on lui ajoute simplement la mention « vieilli » ou « littéraire ». Prenez le mot aïeul. Au pluriel, « les aïeux », ce sont les ancêtres, et « les aïeuls », les grands-parents : deux pluriels pour un seul mot. Ils ont vieilli, mais un lecteur de Balzac doit pouvoir les trouver.

  **Journaliste :** Pour terminer, quel est votre mot préféré parmi les nouveaux venus ?

  **Nathalie Bergeron :** J'aime beaucoup « divulgâcher », une création québécoise qui remplace « spoiler ». C'est la preuve que le français sait encore inventer, à condition qu'on lui en laisse le temps.

  **Journaliste :** Nathalie Bergeron, merci beaucoup.
items:
  - q: "При каком условии слово попадает в словарь?"
    options: ["Если его предложит Академия.", "Если оно долго и часто встречается у разных авторов.", "Если оно модное в этом году."]
    answer: 1
    explain: "*Quand un mot apparaît souvent, chez des auteurs variés, et pendant plusieurs années, il devient candidat.* Модное слово, исчезающее через полгода, — *n'a aucune chance*."
  - q: "Что Натали Бержерон думает о «новых» женских формах?"
    options: ["Это действительно новые слова, придуманные во Франции.", "Многие из них давно употребляются, например в Квебеке.", "Их не стоит включать в словарь."]
    answer: 1
    explain: "*Pas vraiment, et c'est ce qui est intéressant. Au Québec, on dit « une auteure »… depuis plus de quarante ans.*"
  - q: "Что значит фраза «Un dictionnaire n'est pas un tribunal» ?"
    options: ["Словарь описывает употребление, а не выносит решения.", "Словарь не может запретить англицизмы по закону.", "Лексикографы часто спорят друг с другом."]
    answer: 0
    explain: "Перед этим: *Le dictionnaire ne fait qu'enregistrer ce que les locuteurs ont décidé… Nous indiquons les deux, avec leur fréquence.* — словарь фиксирует, а не судит."
  - q: "Какая форма, по её словам, побеждает у молодых французов?"
    options: ["auteure", "autrice", "auteur"]
    answer: 1
    explain: "*en France, « autrice » l'emporte nettement chez les jeunes*; в Квебеке большинство за *auteure*."
  - q: "Как она отвечает на упрёк в избытке англицизмов?"
    options: ["Соглашается: их стало слишком много.", "Заимствований немного, и они быстро «офранцуживаются».", "Предлагает заменить их квебекскими словами."]
    answer: 1
    explain: "*En réalité, les emprunts représentent une petite partie des entrées nouvelles… il reçoit un genre et un pluriel français.*"
  - q: "Почему говорят une start-up?"
    options: ["По аналогии с une entreprise.", "Потому что в английском это слово женского рода.", "Так решила реформа 1990 года."]
    answer: 0
    explain: "*Souvent par analogie avec le mot français le plus proche… une start-up, parce qu'on pense à une entreprise.*"
  - q: "Какой принцип мн. ч. составных слов она называет?"
    options: ["Изменяется всегда только последний элемент.", "Изменяются только существительные и прилагательные.", "Составные слова никогда не изменяются."]
    answer: 1
    explain: "*on ne met la marque du pluriel que sur les éléments qui peuvent varier, c'est-à-dire les noms et les adjectifs* — поэтому *des chefs-d'œuvre*."
  - q: "Les aïeux — это…"
    options: ["бабушки и дедушки", "предки", "старики"]
    answer: 1
    explain: "*« les aïeux », ce sont les ancêtres, et « les aïeuls », les grands-parents* — два мн. ч. с разным смыслом."
  - q: "Что для неё доказывает слово divulgâcher?"
    options: ["Что французский ещё способен создавать слова.", "Что англицизмы нельзя заменить.", "Что квебекские слова не приживаются во Франции."]
    answer: 0
    explain: "*C'est la preuve que le français sait encore inventer, à condition qu'on lui en laisse le temps.*"
