title: "Повторение B. Уроки 17–22"
level: b1
book: book-pkk
summary: "Проверяешь вопросы к подлежащему и дополнению, числа, местоимения-дополнения, местоименные глаголы, passé composé, imparfait и согласование причастия и видишь на «Прогрессе», к какому уроку вернуться."
topics:
  - "Вопрос: qui, qu'est-ce qui, qu'est-ce que, à quoi, de qui…"
  - "Числительные до 1000 и порядковые"
  - "Futur immédiat и passé immédiat; местоимения le, la, lui, leur"
  - "Местоименные глаголы в настоящем времени и в passé composé"
  - "Passé composé: avoir или être, согласование причастия; imparfait"
  - "Глаголы на -endre, voir, finir, savoir, prendre, connaître, partir, pouvoir, vouloir"
