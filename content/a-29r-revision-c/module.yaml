title: "Повторение C. Уроки 23–29"
level: b1
book: book-pkk
summary: "Проверяешь futur simple и si + présent, ударные местоимения и сравнение, passé simple, qui / que и отрицания, plus-que-parfait, согласование времён, частичный артикль и пассив — и видишь на «Прогрессе», к какому уроку вернуться."
topics:
  - "Futur simple, si + présent, ответ si, tout, dire de"
  - "Ударные местоимения; степени сравнения прилагательных и наречий; de перед прилагательным"
  - "Passé simple"
  - "Qui и que; отрицания personne, rien, jamais; permettre / promettre de"
  - "Plus-que-parfait; женский род; глаголы на -uire"
  - "Согласование времён и futur dans le passé; наречия на -ment; apercevoir"
  - "Частичный артикль; страдательный залог; множественное число; devoir"
