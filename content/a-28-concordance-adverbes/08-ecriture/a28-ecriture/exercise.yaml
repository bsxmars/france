title: "Message : la réunion du club"
type: writing
intro: "Напиши письмо другу по плану урока. Пересказывай с согласованием времён."
prompt: |
  Ton ami(e) n'était pas à la réunion de ton club (sport, théâtre, musique…). Tu lui écris pour raconter ce que le président ou la présidente a annoncé : les nouvelles, les projets, les questions des membres et les réponses.

  Напиши **60–120 слов**.
words: [60, 120]
target_grammar:
  - "согласование времён: il a dit que + imparfait / plus-que-parfait"
  - "futur dans le passé: elle a annoncé que nous répéterions…"
  - "косвенный вопрос: il a demandé si…"
  - "наречия на -ment: franchement, heureusement, gentiment"
checklist:
  - "Есть обращение и прощание."
  - "Хотя бы четыре пересказанных фразы (a dit que, a annoncé que, a expliqué que, a ajouté que)."
  - "После глагола речи в прошлом — imparfait, plus-que-parfait или futur dans le passé, а не présent и futur simple."
  - "Хотя бы два futur dans le passé (-rait, -raient)."
  - "Есть косвенный вопрос с si: X a demandé si…"
  - "Хотя бы два наречия на -ment."
model_answer: |
  Salut Paul,

  Tu n'étais pas à la réunion du club de théâtre hier soir, alors je te raconte. La présidente nous a annoncé que le club avait trouvé une nouvelle salle et que nous répéterions désormais le mardi. Elle a expliqué que le spectacle de juin serait une comédie de Molière et qu'elle choisirait les rôles la semaine prochaine. Elle a ajouté que la cotisation augmenterait un peu, mais que les étudiants paieraient moins. Ensuite, Marc a demandé si on pouvait inviter nos familles à la générale. Elle a répondu gentiment que c'était une excellente idée. Franchement, la soirée était très sympa ! Tu viendras mardi ?

  À plus,
  Inès
