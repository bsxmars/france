title: "Урок 28. Согласование времён, futur dans le passé, наречия на -ment, -aître, apercevoir"
level: b1
book: book-pkk
summary: "Пересказываешь чужие слова и мысли в прошлом, правильно сдвигая времена (il a dit qu'il viendrait), образуешь наречия на -ment и спрягаешь connaître, paraître, disparaître и apercevoir."
topics:
  - "Согласование времён изъявительного наклонения: одновременность, предшествование, следование"
  - "Futur dans le passé: образование и употребление"
  - "Образование наречий на -ment"
  - "Глаголы на -aître (connaître, paraître, disparaître…); глагол apercevoir"
sources:
  - {title: "Tex's French Grammar — Reported speech in the past", url: "https://www.laits.utexas.edu/tex/gr/tad2.html"}
  - {title: "Tex's French Grammar — Conditional", url: "https://www.laits.utexas.edu/tex/gr/tac1.html"}
  - {title: "Tex's French Grammar — Simple future (irregular)", url: "https://www.laits.utexas.edu/tex/gr/taf3.html"}
  - {title: "Tex's French Grammar — Adverbs: formation and placement", url: "https://www.laits.utexas.edu/tex/gr/adv2.html"}
  - {title: "Tex's French Grammar — savoir vs. connaître", url: "https://www.laits.utexas.edu/tex/gr/virr10.html"}
  - {title: "Le Point du FLE — Adverbes", url: "https://www.lepointdufle.net/p/adverbes.htm"}
