title: "Глава. Относительные, указательные, притяжательные и вопросительные местоимения"
level: c1
book: book-grammar
summary: "Строишь сложные определительные придаточные без ошибок: dont как дополнение существительного с французским порядком слов, ce à quoi и de quoi, lequel и duquel после предлогов, parmi lesquels; различаешь celui-ci и celui-là, ce и cela, c'est и il est; уверенно употребляешь le mien, au tien, les nôtres и вопросы qui est-ce qui, qu'est-ce qui, lequel, à quoi bon — в нейтральном и высоком регистре."
topics:
  - "Относительные местоимения qui, que, quoi, dont, où: dont как дополнение существительного, dont с числительными, où временное, ce qui / ce que / ce dont / ce à quoi"
  - "Lequel, auquel, duquel после предлогов; prep + qui для лиц; parmi lesquels; dont невозможно после предлога; lequel в высоком стиле"
  - "Указательные местоимения celui, celle, ceux, celles; celui-ci / celui-là; ce, cela, ceci, ça; c'est и il est"
  - "Притяжательные местоимения le mien, le tien… и слияние с à / de"
  - "Вопросительные местоимения qui, que, quoi, qui est-ce qui / que, qu'est-ce qui / que, lequel, auquel, duquel"
