title: "Урок 3. Глаголы I группы, множественное число"
level: b1
book: book-pkk
summary: "Узнаёшь глаголы I группы на -er, ставишь их в 3-е лицо единственного и множественного числа и в повелительное наклонение, образуешь множественное число существительных."
topics:
  - "Глаголы I группы (-er): il parle — ils parlent, немое окончание -ent"
  - "Повелительное наклонение I группы: parle ! — parlez !"
  - "Множественное число существительных: немое -s, число слышно по определителю (la → les, ma → mes, cette → ces)"
sources:
  - {title: "Tex's French Grammar — -er verbs (regular), present tense", url: "https://www.laits.utexas.edu/tex/gr/ver1.html"}
  - {title: "Tex's French Grammar — Imperative mood", url: "https://www.laits.utexas.edu/tex/gr/tai1.html"}
  - {title: "Tex's French Grammar — Number: singular, plural", url: "https://www.laits.utexas.edu/tex/gr/no2.html"}
  - {title: "Le Point du FLE — Indicatif présent", url: "https://www.lepointdufle.net/p/present.htm"}
  - {title: "Le Point du FLE — Impératif", url: "https://www.lepointdufle.net/p/imperatif.htm"}
