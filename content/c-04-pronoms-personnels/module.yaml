title: "Глава. Личные местоимения"
level: c1
book: book-grammar
summary: "Безошибочно ставишь безударные местоимения при каузативе, двух инфинитивах и в императиве; чувствуешь нейтральное le (je le savais, plus tard que je ne le pensais, fatiguées, nous le sommes); выбираешь между lui и à lui, между lui и soi; различаешь y / en и le / la / les и свободно пользуешься идиомами с ними: s'en aller, en vouloir à qn, n'y être pour rien, s'y prendre, en avoir assez."
topics:
  - "Безударные местоимения: место при инфинитиве, faire / laisser + инфинитив, императив, литературное «je le veux faire»"
  - "Нейтральное le: замена мысли, le-атрибут (неизменяемое), le в сравнительных придаточных, le и ce"
  - "Ударные местоимения: десять случаев употребления; глаголы с à + ударная форма (penser à lui, s'adresser à elle)"
  - "Возвратное ударное soi: обобщённый субъект (on, chacun, personne, il faut), soi-même, cela va de soi"
  - "Y: дополнение с à / sur для вещей, y = à cela, y и lui, идиомы y être, n'y être pour rien, s'y prendre, s'y connaître, ça y est"
  - "En: дополнение с de, en + количество, en или le / la / les, причастие с en, идиомы s'en aller, en vouloir à, en avoir assez, n'en pouvoir plus, en venir à, s'en faire"
