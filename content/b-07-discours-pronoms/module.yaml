title: "Досье 7. Косвенная речь, двойные местоимения"
level: b2
book: book-cosmo
summary: "Пересказываешь чужие слова, вопросы и просьбы в настоящем и в прошлом — с согласованием времён и сдвигом «завтра → le lendemain», — и заменяешь сразу два дополнения местоимениями в правильном порядке, в том числе в повелительном наклонении: je le lui ai dit, donne-le-moi, ne m'en parle pas."
topics:
  - "Косвенная речь в настоящем: que, si, ce que / ce qui, вопросительные слова, de + инфинитив, глаголы-вводители"
  - "Косвенная речь в прошлом: согласование времён, указатели времени и места (la veille, le lendemain, ce jour-là)"
  - "Двойные местоимения-дополнения: порядок, y и en, сложные времена, инфинитив"
  - "Двойные местоимения в утвердительном и отрицательном повелительном наклонении"
sources:
  - {title: "Tex's French Grammar — Reported speech in the present", url: "https://www.laits.utexas.edu/tex/gr/tad1.html"}
  - {title: "Tex's French Grammar — Reported speech in the past", url: "https://www.laits.utexas.edu/tex/gr/tad2.html"}
  - {title: "Tex's French Grammar — Order of object pronouns", url: "https://www.laits.utexas.edu/tex/gr/pro9.html"}
  - {title: "Le Point du FLE — Discours rapporté, discours indirect", url: "https://www.lepointdufle.net/p/discoursrapporte.htm"}
  - {title: "Le Point du FLE — Place des pronoms COD et COI", url: "https://www.lepointdufle.net/ressources_fle/place_des_pronoms.htm"}
  - {title: "Le Point du FLE — Impératif", url: "https://www.lepointdufle.net/p/imperatif.htm"}
