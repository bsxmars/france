title: "Глава. Субъюнктив"
level: c1
book: book-grammar
summary: "Уверенно образуешь présent и passé du subjonctif, включая глаголы с двумя основами и «ловушки» орфографии (que nous étudiions, que vous croyiez); выбираешь наклонение в дополнительном, относительном и обстоятельственном придаточном, различаешь глаголы с двойным управлением наклонением (dire, comprendre, admettre, supposer), ставишь ne explétif, где его требует soutenu; понимаешь subjonctif в независимом предложении (Qu'il entre ! Vive la République ! Plaise au ciel…) и узнаёшь imparfait и plus-que-parfait du subjonctif в литературном тексте (qu'il vînt, qu'il eût compris, eût-il su…)."
topics:
  - "Présent и passé du subjonctif: образование, неправильные глаголы, орфографические тонкости"
  - "Subjonctif в дополнительном придаточном: воля, чувство, сомнение, оценка; глаголы с двумя наклонениями; ne explétif"
  - "Subjonctif в относительном придаточном: превосходная степень, le seul, отрицание и вопрос, цель"
  - "Subjonctif в обстоятельственных придаточных: время, цель, отрицаемая причина, уступка, условие, следствие, sans que"
  - "Subjonctif в независимом предложении: приказ третьему лицу, пожелание, застывшие формулы"
  - "Imparfait и plus-que-parfait du subjonctif: узнавание, согласование времён в soutenu, сводная таблица"
