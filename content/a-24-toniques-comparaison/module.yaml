title: "Урок 24. Ударные местоимения, степени сравнения, de вместо des"
level: b1
book: book-pkk
summary: "Употребляешь moi, toi, lui, eux… для выделения, после предлогов и в c'est… qui, сравниваешь (plus / moins / aussi… que, le plus…, meilleur, pire) и пишешь de вместо des перед прилагательным: de belles fleurs."
topics:
  - "Ударные (самостоятельные) местоимения moi, toi, lui, elle, nous, vous, eux, elles"
  - "Степени сравнения прилагательных; bon — meilleur, mauvais — plus mauvais / pire"
  - "De вместо des перед прилагательным во множественном числе"
sources:
