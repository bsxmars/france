  - {title: "Tex's French Grammar — Superlative of adjectives", url: "https://www.laits.utexas.edu/tex/gr/adj7.html"}
  - {title: "Tex's French Grammar — Indefinite articles", url: "https://www.laits.utexas.edu/tex/gr/det4.html"}
