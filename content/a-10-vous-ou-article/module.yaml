title: "Урок 10. Форма vous, où, определённый артикль, tout, à — de"
level: b1
book: book-pkk
summary: "Обращаешься на «вы» (vous parlez, vous dites, vous faites), спрашиваешь «где? куда? откуда?», понимаешь, когда нужен определённый артикль, говоришь «весь, все» и различаешь «в» и «из»: à Paris — de Paris."
topics:
  - "2-е лицо мн. ч. настоящего времени: -ez; исключения vous êtes, vous dites, vous faites"
  - "Вопросительное наречие où, d'où: порядок слов в вопросе"
  - "Определённый артикль: единственный предмет, уже упомянутый, общее понятие"
  - "Неопределённое прилагательное tout, toute, tous, toutes"
  - "Предлоги à — de: направление и исходная точка движения"
