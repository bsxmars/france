title: "Досье 3. Сравнение, относительные местоимения, mise en relief, y и en"
level: b2
book: book-cosmo
summary: "Сравниваешь и выстраиваешь иерархию (plus de… que, autant que, le moindre, le pire), связываешь мысли без повторов через dont, où, lequel, auquel, duquel и ce à quoi, выделяешь главное конструкциями c'est… qui / que, ce qui… c'est, si… c'est parce que и уверенно выбираешь между y, en, à lui и de lui."
topics:
  - "Comparatif и superlatif прилагательных, наречий, существительных и глаголов; meilleur / mieux, moindre, pire"
  - "Относительные местоимения: qui, que, dont, où; составные lequel, auquel, duquel после предлогов; qui после предлога для людей; ce à quoi, ce dont"
  - "Mise en relief: c'est / ce sont… qui, que, où, dont; ce qui / ce que / ce dont… c'est; si… c'est parce que / c'est pour"
  - "Местоимения y и en вместо дополнений с à и de; à lui / de lui для людей"
sources:
