- id: a14-y
  lesson: a-14-en-y-faire/01-grammaire
  q: "Что заменяет *y*? «Ты идёшь на почту? — Да, иду (туда)»."
  a: "Место с *à, dans, sur, sous, chez*: «туда, там». *Tu vas à la poste ? — Oui, j'**y** vais.*"
- id: a14-en
  lesson: a-14-en-y-faire/01-grammaire
  q: "Что заменяет *en*? «Ты с почты? — Да, (оттуда)»."
  a: "Место с *de*: «оттуда». *Tu viens de la poste ? — Oui, j'**en** viens.*"
- id: a14-place-en-y
  lesson: a-14-en-y-faire/01-grammaire
  q: "Где стоят *en* и *y*?"
  a: "Перед глаголом (*j'y vais, je n'y vais pas, y allez-vous ?*), перед инфинитивом, к которому относятся (*je vais y aller*); после глагола — только в утвердительном повелительном: *Allez-y ! Sors-en !*"
- id: a14-vas-y
  lesson: a-14-en-y-faire/01-grammaire
  q: "«Иди туда!», «Оставайся там!» — на «ты»."
  a: "***Vas-y !*** ***Restes-y !*** — перед *y* и *en* повелительное на -e и *va* получает -s. Но: *N'y va pas !*"
- id: a14-quand-comment
  lesson: a-14-en-y-faire/01-grammaire
  q: "Порядок слов после *quand* и *comment*."
  a: "Местоимение — простая инверсия: *Quand part-il ?* Существительное — *Quand part ton ami ?* или *Quand ton ami part-il ?*; с дополнением или обстоятельством — только сложная: *Quand ton ami part-il pour Lyon ?* С *je* — *est-ce que*."
- id: a14-comment-etre
  lesson: a-14-en-y-faire/01-grammaire
  q: "«Какая у тебя комната?»"
  a: "*Comment est ta chambre ?* — с *être* *comment* значит «какой?»."
- id: a14-faire
  lesson: a-14-en-y-faire/01-grammaire
  q: "Проспрягай *faire*."
  a: "*je fais, tu fais, il fait, nous faisons* [fə-zɔ̃], *vous **faites**, ils **font***. Повелительное: *fais ! faisons ! faites !*"
- id: a14-on-y-va
  lesson: a-14-en-y-faire/01-grammaire
  q: "«Пошли!» и «Да, иду (туда)» — почему не просто *je vais*?"
  a: "*Aller* без указания места не употребляют: ***On y va !*** — ***Oui, j'y vais.***"
- id: a14-a-pied
  lesson: a-14-en-y-faire/07-lecture
  q: "«Мы ходим туда пешком». «Мы возвращаемся оттуда в полдень»."
  a: "Nous **y** allons **à pied**. Nous **en** revenons **à midi**."
- id: a14-promenade
  lesson: a-14-en-y-faire/07-lecture
  q: "«Гулять», «делать успехи», «печь пирожные» — с *faire*."
  a: "**faire une promenade**, **faire des progrès**, **faire des gâteaux**."
- id: a14-carte-postale
  lesson: a-14-en-y-faire/08-ecriture
  q: "«Хорошая погода! Как у тебя дела? Когда ты приедешь?»"
  a: "**Il fait beau !** **Comment vas-tu ?** **Quand viens-tu ?**"
- id: a14-tout-droit
  lesson: a-14-en-y-faire/09-ecoute
  q: "«Как туда пройти? — Идите прямо до Сены»."
  a: "**Comment est-ce que j'y vais ?** — **Allez tout droit**, jusqu'à la Seine."
- id: a14-quand-oral
  lesson: a-14-en-y-faire/09-ecoute
  q: "Как звучат *quand est-ce que* и *comment allez-vous*?"
  a: "Немое *-d* / *-t* звучит как [t] перед гласной: [kɑ̃-**t**ɛs-kə], [kɔ-mɑ̃-**t**a-le-vu]."
