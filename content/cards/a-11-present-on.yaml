- id: a11-ce-sont
  lesson: a-11-present-on/01-grammaire
  q: "«Это книга» и «Это книги» — утверждение, отрицание, вопрос."
  a: "*C'est un livre. Ce n'est pas un livre. Est-ce un livre ?* — *Ce sont des livres. Ce ne sont pas des livres. Est-ce que ce sont des livres ?*"
- id: a11-on
  lesson: a-11-present-on/01-grammaire
  q: "Что значит *on* и в каком лице глагол после него?"
  a: "«Кто-то, люди» (*on sonne* — звонят, *on dit* — говорят) или разговорное «мы» (*on regarde ?* — посмотрим?). Глагол — **3-е лицо ед. ч.**"
- id: a11-er-present
  lesson: a-11-present-on/01-grammaire
  q: "Проспрягай *parler* в настоящем времени."
  a: "*je parle, tu parles, il parle, nous parlons, vous parlez, ils parlent*. Не слышны окончания -e, -es, -e, -ent."
- id: a11-negation
  lesson: a-11-present-on/01-grammaire
  q: "Как строится отрицание с глаголом на -er?"
  a: "*ne* + глагол + *pas*; перед гласной *n'*: *je ne parle pas, il **n'**aime pas, on **n'**écoute pas*."
- id: a11-inversion-t
  lesson: a-11-present-on/01-grammaire
  q: "«Он говорит по-французски?» — с инверсией."
  a: "***Parle-t-il** français ?* — между *-e* и *il / elle / on* вставляется **-t-**. С *je* — только *est-ce que je parle… ?*"
- id: a11-imperatif
  lesson: a-11-present-on/01-grammaire
  q: "Повелительное наклонение *regarder*."
  a: "***Regarde !*** (без -s) — ***Regardons !*** — ***Regardez !*** Отрицание: *Ne regarde pas !*"
- id: a11-trois-questions
  lesson: a-11-present-on/01-grammaire
  q: "Три способа спросить «Вы слушаете?»"
  a: "Интонация: *Vous écoutez ?* — *Est-ce que vous écoutez ?* — инверсия: *Écoutez-vous ?*"
- id: a11-on-chante
  lesson: a-11-present-on/07-lecture
  q: "«Здесь мы поём вместе каждый вторник»."
  a: "*Ici, **on chante** ensemble tous les mardis.* — *on* = «мы», глагол в 3-м лице ед. ч."
- id: a11-regles
  lesson: a-11-present-on/07-lecture
  q: "Правила: «Приходите вовремя! Не курите в зале!»"
  a: "***Arrivez** à l'heure ! **Ne fumez pas** dans la salle !*"
- id: a11-ce-sont-musiciens
  lesson: a-11-present-on/09-ecoute
  q: "«Это бельгийские музыканты»."
  a: "***Ce sont** des musiciens belges.* — о нескольких **ce sont**."
- id: a11-passe-dimanche
  lesson: a-11-present-on/08-ecriture
  q: "«Позвони мне! Заходи к нам в воскресенье!»"
  a: "***Téléphone**-moi ! **Passe** chez nous dimanche !* — у глаголов на *-er* в форме «ты» без *-s*."
- id: a11-desolee
  lesson: a-11-present-on/09-ecoute
  q: "«Извини, я работаю до восьми»."
  a: "***Désolé(e)**, je travaille **jusqu'à** huit heures.*"
