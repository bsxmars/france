- id: a01-ordre
  lesson: a-01-article/01-grammaire
  q: "Какой порядок слов во французском утвердительном предложении?"
  a: "**Прямой**: подлежащее → сказуемое → остальное. *Léa parle français.* И глагол есть всегда: *Le café **est** chaud.*"
- id: a01-mots-outils
  lesson: a-01-article/01-grammaire
  q: "Чем знаменательные слова отличаются от служебных?"
  a: "Знаменательные называют что-то и бывают членами предложения (*gare, parle, petit*). Служебные помогают другим словам: артикль, *sa*, предлоги *à, de*, союз *et*."
- id: a01-article-role
  lesson: a-01-article/01-grammaire
  q: "Что показывает артикль?"
  a: "**Род** (м. / ж.), **число** (ед. / мн.) и **определённость** (тот самый / какой-то)."
- id: a01-articles-defini
  lesson: a-01-article/01-grammaire
  q: "Формы определённого артикля?"
  a: "**le** (м. р.), **la** (ж. р.), **l'** перед гласной и немым h, **les** (мн. ч.): *le café, la gare, l'ami, les sacs*."
- id: a01-articles-indefini
  lesson: a-01-article/01-grammaire
  q: "Формы неопределённого артикля?"
  a: "**un** (м. р.), **une** (ж. р.), **des** (мн. ч.): *un sac, une tasse, des sacs*."
- id: a01-sans-article
  lesson: a-01-article/01-grammaire
  q: "Когда перед существительным нет артикля (урок 1)?"
  a: "Перед **притяжательным словом** (*sa tasse*, не ~~la sa tasse~~) и перед **именами людей** (*Paul parle*)."
- id: a01-la-table
  lesson: a-01-article/01-grammaire
  q: "Переведи с артиклем: стол, гараж, школа."
  a: "*la table* (ж. р.!), *le garage* (м. р.!), *l'école* (ж. р.). Род учи вместе со словом."
- id: a01-voici
  lesson: a-01-article/07-lecture
  q: "«Вот вокзал», «Вот Поль»."
  a: "***Voici** la gare.* — с артиклем; ***Voici** Paul.* — перед именем артикля нет."
- id: a01-de-genitif
  lesson: a-01-article/07-lecture
  q: "«Чашка Леи», «кафе у вокзала (вокзальное)»."
  a: "*la tasse **de** Léa*, *le café **de** la gare*: *de* передаёт русский родительный падеж."
- id: a01-sur-la-table
  lesson: a-01-article/09-ecoute
  q: "«Чашка на столе»."
  a: "*La tasse **est sur** la table.* — нужна связка *est*, *sur* — «на»."
- id: a01-le-la-oral
  lesson: a-01-article/09-ecoute
  q: "Как на слух отличить *le*, *la* и *les*?"
  a: "**le** [lə] — краткий неясный звук, **la** [la] — открытое [a], **les** [le]; перед гласной — [lez]: *les amis* [le-za-mi]."
- id: a01-cafe-petit
  lesson: a-01-article/08-ecriture
  q: "«Кафе маленькое, но терраса большая»."
  a: "*Le café **est** petit, **mais** la terrasse **est** grande.* — артикль, связка, согласование *grand → grande*."
