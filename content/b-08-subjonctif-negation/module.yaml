title: "Досье 8. Subjonctif в относительных придаточных, мнение и вероятность, ne… ni… ni…"
level: b2
book: book-cosmo
summary: "Формулируешь пожелание и цель через относительное придаточное (je cherche quelqu'un qui puisse…), выбираешь indicatif или subjonctif после глаголов мнения и выражений вероятности (je pense qu'il a raison — je ne pense pas qu'il ait raison; il est probable qu'il viendra — il est peu probable qu'il vienne) и отрицаешь два элемента сразу: ne… ni… ni…, sans… ni…, ni l'un ni l'autre."
topics:
  - "Относительное придаточное с subjonctif: пожелание, цель, требование к ещё не найденному предмету"
  - "Subjonctif или indicatif после глаголов мнения: penser, croire, trouver, il me semble, le fait que"
  - "Subjonctif для выражения вероятности и возможности; indicatif после il est probable / certain, peut-être que"
  - "Отрицание ne… ni… ni…, sans… ni…, ni l'un ni l'autre"
sources:
